<rect x="30" y="1050" width="1620" height="230" rx="8" fill="#FFFBEB" stroke="#D97706"/>
<text x="46" y="1074" font-size="11" font-weight="600">PUNTOS CLAVE DEL DISEÑO</text>
<text x="46" y="1091" font-size="11">1.  El FortiGate es el ÚNICO punto de ruteo entre VLANs. Los switches son capa 2 pura (no ip routing): si no hay política escrita, no pasa.</text>
<text x="46" y="1108" font-size="11">2.  Las VLAN 90 y 91 NO existen en el FortiGate: no tienen interfaz, ni IP, ni ruta; viven solo en el switch de servidores.</text>
<text x="46" y="1125" font-size="11">—   corosync es sensible al jitter, y un firewall ocupado hace que los nodos se reinicien por watchdog.</text>
<text x="46" y="1142" font-size="11">3.  Dos trunks separados (internal2 acceso / internal3 servidores): así un backup hacia los servidores no degrada la navegación de los 80 puestos.</text>
<text x="46" y="1159" font-size="11">4.  Las políticas apuntan a la ZONA SD-WAN, no a wan1. Cuando llegue Claro se habilita el miembro 2 y no se toca ninguna política.</text>
<text x="46" y="1176" font-size="11">5.  internal1 (192.168.1.99) queda siempre como puerto de gestión y rescate, fuera del diseño de VLANs.</text>
<text x="46" y="1201" font-size="11" font-weight="600">PENDIENTES</text>
<text x="46" y="1218" font-size="11">·  Confirmar el gateway de Telefónica: 209.13.171.177. El informado (209.13.181.177) no pertenece a la red 209.13.171.176/29.</text>
