# (Superseded) Este script quedo reemplazado por fortigate-60f-puesta-a-punto.conf,
# que ademas limpia las redes de prueba. Se conserva como referencia del
# enfoque "delta" sobre un equipo en produccion.
#=============================================================================
#  FT-60F-DDC  -  SCRIPT DELTA SOBRE LA CONFIGURACION ACTUAL
#  Generado a partir del backup FT-60F-DDC_7-2_1575_202610141133
#  FortiOS 7.2.6 build1575
#
#  OBJETIVO: aplicar el diseno del proyecto SIN tocar el acceso de gestion.
#
#  LO QUE ESTE SCRIPT **NO** TOCA (garantia de acceso):
#    - interfaz "internal" (hard-switch) 192.168.1.99/24 con HTTPS+SSH
#    - su unico miembro internal1  ("eth1")
#    - el DHCP server 1 (192.168.1.110-210)
#    - el usuario admin, su password y sus trusthosts
#    - internal2 (VLAN 100 "LAN-ETH" 172.16.0.1/24) y su DHCP 3
#    - internal3 ("LAN-WIFI" 10.10.1.1/24) y su DHCP 4
#    - fortilink (a+b, 10.255.1.1/24) y su DHCP 2
#
#  En ningun momento se pierde la sesion por 192.168.1.99.
#  Igual: tener el cable de consola a mano y hacer backup antes.
#
#      execute backup config flash
#
#  PUERTOS QUE USA EL PROYECTO (los unicos realmente libres):
#      internal4 -> TRUNK al switch de ACCESO     (VLAN 10,30,35,50,60)
#      internal5 -> TRUNK al switch de SERVIDORES (VLAN 20,25)
#=============================================================================


#=============================================================================
#  A - SISTEMA   (no afecta la administracion)
#=============================================================================

# --- DNS: hoy apunta a FortiGuard con DNS-over-TLS. Se pasa a los de
#     Telefonica. OJO: hay que sacar el modo DoT o el ISP no responde.
config system dns
    set protocol cleartext
    unset server-hostname
    set primary 200.0.243.10
    set secondary 200.0.243.11
end

# --- NTP: agregar servidores locales (hora correcta = requisito del IPsec)
config system ntp
    set type custom
    set ntpsync enable
    set syncinterval 60
    config ntpserver
        edit 1
            set server "ar.pool.ntp.org"
        next
        edit 2
            set server "pool.ntp.org"
        next
    end
end

# --- Politicas con varias interfaces de origen (las usa la seccion G)
config system settings
    set gui-multiple-interface-policy enable
end

# --- Zona horaria: HOY ESTA EN 04. Verificar que sea la de Buenos Aires:
#       config system global
#           set timezone ?          <- lista los indices disponibles
#       end
#     Si el indice correcto es otro, aplicarlo. En 7.2 el valor es NUMERICO.
#     Se deja comentado para no cambiarlo a ciegas:
# config system global
#     set timezone <INDICE-BUENOS-AIRES>
# end

# --- Puerto de administracion HTTPS. Si se cambia, la GUI pasa a
#     https://192.168.1.99:8443 . Se deja comentado para no sorprender:
# config system global
#     set admin-sport 8443
# end


#=============================================================================
#  B - WAN1 : TELEFONICA   (hoy esta en modo DHCP)
#=============================================================================
#  GW 209.13.171.177 - CONFIRMAR CON TELEFONICA.
#  El dato informado 209.13.181.177 no pertenece a la red 209.13.171.176/29.

config system interface
    edit "wan1"
        set alias "ISP-TELEFONICA"
        set mode static
        set ip 209.13.171.178 255.255.255.248
        set allowaccess ping
        set role wan
        set description "Telefonica /29"
    next
end

#--- VERIFICAR: execute ping 209.13.171.177 -----------------------------------


#=============================================================================
#  C - SD-WAN   *** LEER ANTES DE EJECUTAR ***
#=============================================================================
#  La politica 1 actual (internal -> wan1) referencia wan1 DIRECTAMENTE.
#  FortiOS no deja meter wan1 en SD-WAN mientras exista esa referencia.
#  Por eso se borra la politica 1 y se recrea apuntando a la zona SD-WAN.
#
#  Durante esos segundos la red 192.168.1.x se queda SIN INTERNET,
#  pero el acceso a la GUI/SSH por 192.168.1.99 NO se ve afectado
#  (es trafico local a la interfaz, no pasa por politicas).

config firewall policy
    delete 1
end

config system sdwan
    set status enable
    config zone
        edit "SDWAN"
        next
    end
    config members
        edit 1
            set interface "wan1"
            set zone "SDWAN"
            set gateway 209.13.171.177
            set priority 1
            set comment "Telefonica - primario"
        next
    end
    config health-check
        edit "ISP-CHECK"
            set server "200.0.243.10" "1.1.1.1" "8.8.8.8"
            set protocol ping
            set interval 1000
            set probe-timeout 1000
            set failtime 5
            set recoverytime 10
            set update-static-route enable
            set members 1
            config sla
                edit 1
                    set latency-threshold 200
                    set jitter-threshold 50
                    set packetloss-threshold 3
                next
            end
        next
    end
    config service
        edit 1
            set name "ALL-TRAFFIC"
            set mode priority
            set health-check "ISP-CHECK"
            set src "all"
            set dst "all"
            set priority-members 1
        next
    end
end

config router static
    edit 1
        set dst 0.0.0.0 0.0.0.0
        set distance 10
        set sdwan-zone "SDWAN"
        set comment "Default por zona SD-WAN"
    next
end

# --- Recrear la salida a internet de la red de gestion (reemplaza la pol. 1)
config firewall policy
    edit 5
        set name "MGMT-INTERNAL->SDWAN"
        set srcintf "internal"
        set dstintf "SDWAN"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set nat enable
        set logtraffic all
        set comments "Equivalente a la politica 1 original"
    next
end

#--- VERIFICAR: diagnose sys sdwan health-check  /  execute ping 8.8.8.8 ------


#=============================================================================
#  D - LIBERAR LA IP DEL DMZ   (conflicto de subred)
#=============================================================================
#  El dmz tiene 10.10.10.1/24, que es la red de la VLAN 10 del diseno.
#  FortiOS NO permite subredes superpuestas: sin esto, la VLAN 10 no se crea.
#
#  El dmz NO tiene DHCP, NO tiene politicas y NO lo referencia ningun objeto:
#  esta sin uso. Aun asi, confirmar que no haya nada enchufado ahi.
#
#  ROLLBACK (si hiciera falta volver atras):
#      config system interface
#          edit "dmz"
#              set ip 10.10.10.1 255.255.255.0
#          next
#      end

config system interface
    edit "dmz"
        unset ip
        set alias "DMZ-LIBRE"
        set description "IP liberada - chocaba con VLAN 10 del proyecto"
    next
end

#  ALTERNATIVA: si preferis NO tocar el dmz, dejar este bloque afuera y
#  renumerar la VLAN de usuarios a 10.10.110.0/24. En ese caso hay que
#  cambiar en TODO el script:
#      10.10.10.    ->  10.10.110.
#  (interfaz VL10-USERS, DHCP 10, objeto NET-USERS y el phase2 del IPsec)


#=============================================================================
#  E - VLANs DEL PROYECTO  sobre internal4 e internal5
#      Ninguna interfaz existente se modifica.
#=============================================================================

config system interface
    edit "internal4"
        set alias "TRUNK-ACCESO"
        set description "802.1Q al switch de acceso"
    next
    edit "internal5"
        set alias "TRUNK-SERVIDORES"
        set description "802.1Q al switch de servidores"
    next
end

# --- VLANs sobre internal4 : switch de ACCESO -------------------------------
config system interface
    edit "VL10-USERS"
        set vdom "root"
        set interface "internal4"
        set vlanid 10
        set ip 10.10.10.1 255.255.255.0
        set allowaccess ping
        set role lan
        set device-identification enable
        set description "80 desktops"
    next
    edit "VL30-WIFICORP"
        set vdom "root"
        set interface "internal4"
        set vlanid 30
        set ip 10.10.30.1 255.255.255.0
        set allowaccess ping
        set role lan
        set device-identification enable
        set description "SSID corporativo"
    next
    edit "VL35-WIFIGUEST"
        set vdom "root"
        set interface "internal4"
        set vlanid 35
        set ip 10.10.35.1 255.255.255.0
        set allowaccess ping
        set role lan
        set description "SSID invitados - solo internet"
    next
    edit "VL50-IOT"
        set vdom "root"
        set interface "internal4"
        set vlanid 50
        set ip 10.10.50.1 255.255.255.0
        set allowaccess ping
        set role lan
        set description "Impresoras / CCTV / IoT"
    next
    edit "VL60-MGMT"
        set vdom "root"
        set interface "internal4"
        set vlanid 60
        set ip 10.10.60.1 255.255.255.0
        set allowaccess ping https ssh snmp
        set role lan
        set description "Switches / AP / iDRAC"
    next
end

# --- VLANs sobre internal5 : switch de SERVIDORES ---------------------------
config system interface
    edit "VL20-SERVERS"
        set vdom "root"
        set interface "internal5"
        set vlanid 20
        set ip 10.10.20.1 255.255.255.0
        set allowaccess ping
        set role lan
        set description "VMs del cluster Proxmox"
    next
    edit "VL25-PVEMGMT"
        set vdom "root"
        set interface "internal5"
        set vlanid 25
        set ip 10.10.25.1 255.255.255.0
        set allowaccess ping
        set role lan
        set description "Nodos Proxmox - administracion"
    next
end

# Las VLAN 90 (corosync) y 91 (storage) NO se definen aca a proposito:
# viven solo en el switch de servidores, sin ruteo. Ver docs/03.

# --- DHCP de las nuevas VLANs (los DHCP 1 a 4 existentes no se tocan) -------
config system dhcp server
    edit 10
        set interface "VL10-USERS"
        set default-gateway 10.10.10.1
        set netmask 255.255.255.0
        set dns-service specify
        set dns-server1 <IP-DNS-INTERNO>
        set dns-server2 200.0.243.10
        set lease-time 28800
        config ip-range
            edit 1
                set start-ip 10.10.10.50
                set end-ip 10.10.10.230
            next
        end
    next
    edit 30
        set interface "VL30-WIFICORP"
        set default-gateway 10.10.30.1
        set netmask 255.255.255.0
        set dns-service specify
        set dns-server1 <IP-DNS-INTERNO>
        set dns-server2 200.0.243.10
        set lease-time 28800
        config ip-range
            edit 1
                set start-ip 10.10.30.50
                set end-ip 10.10.30.230
            next
        end
    next
    edit 35
        set interface "VL35-WIFIGUEST"
        set default-gateway 10.10.35.1
        set netmask 255.255.255.0
        set dns-service default
        set lease-time 7200
        config ip-range
            edit 1
                set start-ip 10.10.35.50
                set end-ip 10.10.35.230
            next
        end
    next
    edit 50
        set interface "VL50-IOT"
        set default-gateway 10.10.50.1
        set netmask 255.255.255.0
        set dns-service default
        set lease-time 86400
        config ip-range
            edit 1
                set start-ip 10.10.50.100
                set end-ip 10.10.50.200
            next
        end
    next
end


#=============================================================================
#  F - OBJETOS
#=============================================================================

config firewall address
    edit "NET-USERS"
        set subnet 10.10.10.0 255.255.255.0
    next
    edit "NET-SERVERS"
        set subnet 10.10.20.0 255.255.255.0
    next
    edit "NET-PVEMGMT"
        set subnet 10.10.25.0 255.255.255.0
    next
    edit "NET-WIFICORP"
        set subnet 10.10.30.0 255.255.255.0
    next
    edit "NET-WIFIGUEST"
        set subnet 10.10.35.0 255.255.255.0
    next
    edit "NET-IOT"
        set subnet 10.10.50.0 255.255.255.0
    next
    edit "NET-MGMT-VL60"
        set subnet 10.10.60.0 255.255.255.0
    next
    edit "NET-MGMT-LEGACY"
        set subnet 192.168.1.0 255.255.255.0
        set comment "Red de gestion actual - internal1"
    next
    edit "NET-SAP"
        set subnet <RED-SAP> <MASK-SAP>
    next
end

config firewall addrgrp
    edit "GRP-LAN-INTERNA"
        set member "NET-USERS" "NET-SERVERS" "NET-PVEMGMT" "NET-WIFICORP" "NET-IOT" "NET-MGMT-VL60" "NET-MGMT-LEGACY"
        set comment "Todo lo interno - usado en el deny de invitados"
    next
end

config firewall service custom
    edit "SAP-DIAG"
        set tcp-portrange 3200-3299
    next
    edit "SAP-GW"
        set tcp-portrange 3300-3399
    next
    edit "SAP-MSG"
        set tcp-portrange 3600-3699
    next
    edit "SAP-WEB"
        set tcp-portrange 8000-8099 44300-44399
    next
    edit "SAP-ICM"
        set tcp-portrange 50000-50099
    next
    edit "SAP-ROUTER"
        set tcp-portrange 3299
    next
    edit "PVE-WEB"
        set tcp-portrange 8006
    next
    edit "PVE-SPICE"
        set tcp-portrange 3128
    next
    edit "PRINT-RAW"
        set tcp-portrange 9100-9102 515 631
    next
end

config firewall service group
    edit "GRP-SAP"
        set member "SAP-DIAG" "SAP-GW" "SAP-MSG" "SAP-WEB" "SAP-ICM" "SAP-ROUTER" "HTTPS" "DNS"
    next
    edit "GRP-SERVIDORES-LAN"
        set member "SMB" "DNS" "LDAP" "KERBEROS" "HTTP" "HTTPS" "RDP" "PING" "SAP-DIAG" "SAP-GW" "SAP-MSG"
    next
    edit "GRP-PVE-ADMIN"
        set member "PVE-WEB" "PVE-SPICE" "SSH" "HTTPS" "PING"
    next
    edit "GRP-SALIDA-SERVIDORES"
        set member "DNS" "HTTP" "HTTPS" "NTP"
    next
end

config firewall shaper traffic-shaper
    edit "GUEST-20M"
        set maximum-bandwidth 20000
        set bandwidth-unit kbps
        set priority low
    next
end


#=============================================================================
#  G - IPsec HACIA SAP    (completar con los datos del proveedor)
#=============================================================================

config vpn ipsec phase1-interface
    edit "VPN-SAP"
        set interface "wan1"
        set ike-version 2
        set keylife 28800
        set peertype any
        set net-device disable
        set proposal aes256-sha256 aes128-sha256
        set dhgrp 14
        set remote-gw <IP-PEER-SAP>
        set psksecret <PSK-SAP>
        set dpd on-idle
        set dpd-retryinterval 30
    next
end

config vpn ipsec phase2-interface
    edit "VPN-SAP-P2-SRV"
        set phase1name "VPN-SAP"
        set proposal aes256-sha256 aes128-sha256
        set dhgrp 14
        set pfs enable
        set keylifeseconds 3600
        set src-subnet 10.10.20.0 255.255.255.0
        set dst-subnet <RED-SAP> <MASK-SAP>
    next
    edit "VPN-SAP-P2-USR"
        set phase1name "VPN-SAP"
        set proposal aes256-sha256 aes128-sha256
        set dhgrp 14
        set pfs enable
        set keylifeseconds 3600
        set src-subnet 10.10.10.0 255.255.255.0
        set dst-subnet <RED-SAP> <MASK-SAP>
    next
end

config router static
    edit 2
        set dst <RED-SAP> <MASK-SAP>
        set device "VPN-SAP"
        set distance 10
        set comment "Redes SAP por el tunel"
    next
end


#=============================================================================
#  H - POLITICAS DEL PROYECTO
#      Se agregan DESPUES de la politica 5 (gestion). El orden de creacion
#      es el orden de evaluacion: el deny de invitados va antes del permit.
#=============================================================================

config firewall policy

    edit 10
        set name "USERS->INTERNET"
        set srcintf "VL10-USERS"
        set dstintf "SDWAN"
        set action accept
        set srcaddr "NET-USERS"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set nat enable
        set utm-status enable
        set av-profile "default"
        set ips-sensor "default"
        set webfilter-profile "default"
        set application-list "default"
        set dnsfilter-profile "default"
        set ssl-ssh-profile "certificate-inspection"
        set logtraffic all
    next

    edit 11
        set name "WIFICORP->INTERNET"
        set srcintf "VL30-WIFICORP"
        set dstintf "SDWAN"
        set action accept
        set srcaddr "NET-WIFICORP"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set nat enable
        set utm-status enable
        set av-profile "default"
        set ips-sensor "default"
        set webfilter-profile "default"
        set application-list "default"
        set dnsfilter-profile "default"
        set ssl-ssh-profile "certificate-inspection"
        set logtraffic all
    next

    edit 12
        set name "GUEST-DENY-LAN"
        set srcintf "VL35-WIFIGUEST"
        set dstintf "any"
        set action deny
        set srcaddr "NET-WIFIGUEST"
        set dstaddr "GRP-LAN-INTERNA"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next

    edit 13
        set name "GUEST->INTERNET"
        set srcintf "VL35-WIFIGUEST"
        set dstintf "SDWAN"
        set action accept
        set srcaddr "NET-WIFIGUEST"
        set dstaddr "all"
        set schedule "always"
        set service "DNS" "HTTP" "HTTPS"
        set nat enable
        set utm-status enable
        set webfilter-profile "default"
        set application-list "default"
        set ssl-ssh-profile "certificate-inspection"
        set traffic-shaper "GUEST-20M"
        set traffic-shaper-reverse "GUEST-20M"
        set logtraffic all
    next

    edit 20
        set name "USERS->SERVERS"
        set srcintf "VL10-USERS" "VL30-WIFICORP"
        set dstintf "VL20-SERVERS"
        set action accept
        set srcaddr "NET-USERS" "NET-WIFICORP"
        set dstaddr "NET-SERVERS"
        set schedule "always"
        set service "GRP-SERVIDORES-LAN"
        set utm-status enable
        set ips-sensor "default"
        set logtraffic all
    next

    edit 30
        set name "LAN->SAP-IPSEC"
        set srcintf "VL10-USERS" "VL30-WIFICORP" "VL20-SERVERS"
        set dstintf "VPN-SAP"
        set action accept
        set srcaddr "NET-USERS" "NET-WIFICORP" "NET-SERVERS"
        set dstaddr "NET-SAP"
        set schedule "always"
        set service "GRP-SAP"
        set utm-status enable
        set ips-sensor "default"
        set logtraffic all
    next

    edit 31
        set name "SAP-IPSEC->SERVERS"
        set srcintf "VPN-SAP"
        set dstintf "VL20-SERVERS"
        set action accept
        set srcaddr "NET-SAP"
        set dstaddr "NET-SERVERS"
        set schedule "always"
        set service "PING"
        set logtraffic all
        set comments "Abrir servicios de a uno, nunca ALL"
    next

    edit 40
        set name "SERVERS->INTERNET"
        set srcintf "VL20-SERVERS" "VL25-PVEMGMT"
        set dstintf "SDWAN"
        set action accept
        set srcaddr "NET-SERVERS" "NET-PVEMGMT"
        set dstaddr "all"
        set schedule "always"
        set service "GRP-SALIDA-SERVIDORES"
        set nat enable
        set utm-status enable
        set av-profile "default"
        set ips-sensor "default"
        set ssl-ssh-profile "certificate-inspection"
        set logtraffic all
    next

    edit 50
        set name "ADMIN->PVE"
        set srcintf "VL60-MGMT" "VL10-USERS" "internal"
        set dstintf "VL25-PVEMGMT"
        set action accept
        set srcaddr "NET-MGMT-VL60" "NET-USERS" "NET-MGMT-LEGACY"
        set dstaddr "NET-PVEMGMT"
        set schedule "always"
        set service "GRP-PVE-ADMIN"
        set logtraffic all
    next

    edit 60
        set name "USERS->IOT"
        set srcintf "VL10-USERS" "VL30-WIFICORP"
        set dstintf "VL50-IOT"
        set action accept
        set srcaddr "NET-USERS" "NET-WIFICORP"
        set dstaddr "NET-IOT"
        set schedule "always"
        set service "HTTP" "HTTPS" "PING" "SMB" "PRINT-RAW"
        set logtraffic all
    next

    edit 61
        set name "IOT-DENY-INTERNET"
        set srcintf "VL50-IOT"
        set dstintf "SDWAN"
        set action deny
        set srcaddr "NET-IOT"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next

    edit 999
        set name "DENY-ALL-LOG"
        set srcintf "any"
        set dstintf "any"
        set action deny
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end


#=============================================================================
#  I - CIERRE
#=============================================================================
#   execute backup config flash
#
#   Verificaciones:
#     get system interface physical | grep -A1 internal
#     diagnose sys sdwan health-check
#     diagnose vpn ike gateway list
#     get router info routing-table all
#     show firewall policy | grep -e "edit " -e "set name"
#
#   ENDURECIMIENTO FINAL - recien cuando TODO este probado y el acceso por
#   la VLAN 60 funcione. Aplicar con consola a mano: un error aca SI deja
#   el equipo inaccesible.
#
#     config system admin
#         edit "admin"
#             set trusthost1 192.168.1.0 255.255.255.0     <- NO SACAR
#             set trusthost2 10.10.60.0 255.255.255.0
#             set trusthost3 10.10.10.0 255.255.255.0
#         next
#     end
#
#   Limpieza opcional de las redes de prueba (LAN-ETH / LAN-WIFI), solo si
#   se confirma que no hay nada conectado:
#     config system dhcp server
#         delete 3
#         delete 4
#     end
#     config system interface
#         delete "LAN"
#     end
#     config system interface
#         edit "internal3"
#             unset ip
#         next
