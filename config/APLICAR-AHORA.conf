#=============================================================================
#  FT-60F-DDC  —  SCRIPT PARA PEGAR AHORA
#  FortiGate 60F · FortiOS 7.2.6 · 2026-10
#
#  ESTADO ASUMIDO
#    · WAN1 ya cableada a Telefonica y con enlace.
#    · internal2 e internal3 TODAVIA SIN CABLE (los switches no llegaron).
#    · Acceso de administracion por internal1 → 192.168.1.99
#
#  QUE DEJA CONFIGURADO
#    1. Limpieza de las redes de prueba de fabrica
#    2. Sistema: DNS, NTP, logs
#    3. WAN1 estatica 209.13.181.178/28 · GW 209.13.181.177
#    4. SD-WAN (hoy solo wan1, listo para sumar Claro)
#    5. Las 7 VLANs del proyecto + DHCP  (quedan DOWN hasta que haya cable)
#    6. ACCESO TEMPORAL A INTERNET por internal4 → 192.168.4.0/24
#    7. Objetos y las politicas del proyecto
#
#  NO INCLUYE (a proposito)
#    · IPsec a SAP: faltan los datos del proveedor. Seccion 9, al final.
#    · Password del admin, trusthosts y puerto de administracion: seccion 10.
#    · Zona horaria: hace falta leer el indice del equipo. Seccion 10.
#
#  NO TOCA
#    · interfaz "internal" (192.168.1.99), internal1, el DHCP 1
#    · el usuario admin ni su password
#    · fortilink (a+b) ni su DHCP 2
#
#  COMO PEGARLO
#    Conectado por internal1 (SSH o GUI). La sesion NO se pierde.
#    ANTES:   execute backup config flash
#    Pegar de a una seccion y mirar la salida. Si una linea falla, FortiOS
#    la saltea y sigue: no asumas que entro todo.
#
#    Los "delete" de la seccion 1 pueden dar "entry not found" si ya
#    corriste algo antes. Es inofensivo, seguir adelante.
#=============================================================================


#=============================================================================
#  1 · LIMPIEZA DE LAS REDES DE PRUEBA
#=============================================================================

config firewall policy
    delete 1
end

config system dhcp server
    delete 3
    delete 4
end

config firewall address
    delete "LAN address"
    delete "internal3 address"
end

config system interface
    delete "LAN"
end

config system interface
    edit "internal3"
        unset ip
        unset alias
        unset device-identification
        unset role
    next
    edit "dmz"
        unset ip
        set alias "DMZ-LIBRE"
        set description "Reservado para publicar servicios - IPs libres .179 a .190"
    next
end


#=============================================================================
#  2 · SISTEMA
#=============================================================================

config system global
    set hostname "FT-60F-DDC"
    set alias "FT-60F-DDC"
    set admintimeout 15
    set strong-crypto enable
    set gui-certificates enable
end

config system settings
    set gui-multiple-interface-policy enable
end

# DNS: venia en FortiGuard sobre DNS-over-TLS. Pasa a los de Telefonica.
# Sin "cleartext" el ISP no responde y te quedas sin resolucion.
config system dns
    set protocol cleartext
    unset server-hostname
    set primary 200.0.243.10
    set secondary 200.0.243.11
end

config system ntp
    set type custom
    set ntpsync enable
    set syncinterval 60
    config ntpserver
        edit 1
            set server "ar.pool.ntp.org"
        next
        edit 2
            set server "pool.ntp.org"
        next
    end
end

config log disk setting
    set status enable
    set diskfull overwrite
end


#=============================================================================
#  3 · WAN1 — TELEFONICA
#     Red 209.13.181.176/28 · usables .177 a .190 · broadcast .191
#     Libres para publicar servicios: .179 a .190 (12 IPs)
#=============================================================================

config system interface
    edit "wan1"
        set alias "ISP-TELEFONICA"
        set mode static
        set ip 209.13.181.178 255.255.255.240
        set allowaccess ping
        set role wan
        set description "Telefonica - 209.13.181.176/28 - GW .177"
    next
end


#=============================================================================
#  4 · SD-WAN Y RUTA POR DEFECTO
#     Las politicas apuntan a la ZONA, no a wan1: cuando llegue Claro se
#     suma el miembro 2 y no se toca ninguna politica.
#=============================================================================

config system sdwan
    set status enable
    config zone
        edit "SDWAN"
        next
    end
    config members
        edit 1
            set interface "wan1"
            set zone "SDWAN"
            set gateway 209.13.181.177
            set priority 1
            set comment "Telefonica - primario"
        next
    end
    config health-check
        edit "ISP-CHECK"
            set server "200.0.243.10" "1.1.1.1" "8.8.8.8"
            set protocol ping
            set interval 1000
            set probe-timeout 1000
            set failtime 5
            set recoverytime 10
            set update-static-route enable
            set members 1
            config sla
                edit 1
                    set latency-threshold 200
                    set jitter-threshold 50
                    set packetloss-threshold 3
                next
            end
        next
    end
    config service
        edit 1
            set name "ALL-TRAFFIC"
            set mode priority
            set health-check "ISP-CHECK"
            set src "all"
            set dst "all"
            set priority-members 1
        next
    end
end

config router static
    edit 1
        set dst 0.0.0.0 0.0.0.0
        set distance 10
        set sdwan-zone "SDWAN"
        set comment "Default por zona SD-WAN"
    next
end


#=============================================================================
#  5 · VLANs DEL PROYECTO
#     internal2 = trunk de ACCESO · internal3 = trunk de SERVIDORES
#     Quedan creadas y DOWN hasta que se enchufen los switches. Es lo esperado.
#=============================================================================

config system interface
    edit "internal2"
        set alias "TRUNK-ACCESO"
        set description "802.1Q al switch de acceso - VLAN 10,30,35,50,60"
    next
    edit "internal3"
        set alias "TRUNK-SERVIDORES"
        set description "802.1Q al switch de servidores - VLAN 20,25"
    next
end

config system interface
    edit "VL10-USERS"
        set vdom "root"
        set interface "internal2"
        set vlanid 10
        set ip 10.10.10.1 255.255.255.0
        set allowaccess ping
        set role lan
        set device-identification enable
        set description "80 desktops"
    next
    edit "VL30-WIFICORP"
        set vdom "root"
        set interface "internal2"
        set vlanid 30
        set ip 10.10.30.1 255.255.255.0
        set allowaccess ping
        set role lan
        set device-identification enable
        set description "SSID corporativo"
    next
    edit "VL35-WIFIGUEST"
        set vdom "root"
        set interface "internal2"
        set vlanid 35
        set ip 10.10.35.1 255.255.255.0
        set allowaccess ping
        set role lan
        set description "SSID invitados - solo internet"
    next
    edit "VL50-IOT"
        set vdom "root"
        set interface "internal2"
        set vlanid 50
        set ip 10.10.50.1 255.255.255.0
        set allowaccess ping
        set role lan
        set description "Impresoras / CCTV / IoT"
    next
    edit "VL60-MGMT"
        set vdom "root"
        set interface "internal2"
        set vlanid 60
        set ip 10.10.60.1 255.255.255.0
        set allowaccess ping https ssh snmp
        set role lan
        set description "Switches / AP / iDRAC"
    next
    edit "VL20-SERVERS"
        set vdom "root"
        set interface "internal3"
        set vlanid 20
        set ip 10.10.20.1 255.255.255.0
        set allowaccess ping
        set role lan
        set description "VMs del cluster Proxmox"
    next
    edit "VL25-PVEMGMT"
        set vdom "root"
        set interface "internal3"
        set vlanid 25
        set ip 10.10.25.1 255.255.255.0
        set allowaccess ping
        set role lan
        set description "Nodos Proxmox - administracion"
    next
end

# VLAN 90 (corosync) y 91 (storage) NO se definen aca a proposito:
# viven solo en el switch de servidores, sin ruteo.

config system dhcp server
    edit 10
        set interface "VL10-USERS"
        set default-gateway 10.10.10.1
        set netmask 255.255.255.0
        set dns-service specify
        set dns-server1 10.10.10.1
        set dns-server2 200.0.243.10
        set lease-time 28800
        config ip-range
            edit 1
                set start-ip 10.10.10.50
                set end-ip 10.10.10.230
            next
        end
    next
    edit 30
        set interface "VL30-WIFICORP"
        set default-gateway 10.10.30.1
        set netmask 255.255.255.0
        set dns-service specify
        set dns-server1 10.10.30.1
        set dns-server2 200.0.243.10
        set lease-time 28800
        config ip-range
            edit 1
                set start-ip 10.10.30.50
                set end-ip 10.10.30.230
            next
        end
    next
    edit 35
        set interface "VL35-WIFIGUEST"
        set default-gateway 10.10.35.1
        set netmask 255.255.255.0
        set dns-service default
        set lease-time 7200
        config ip-range
            edit 1
                set start-ip 10.10.35.50
                set end-ip 10.10.35.230
            next
        end
    next
    edit 50
        set interface "VL50-IOT"
        set default-gateway 10.10.50.1
        set netmask 255.255.255.0
        set dns-service default
        set lease-time 86400
        config ip-range
            edit 1
                set start-ip 10.10.50.100
                set end-ip 10.10.50.200
            next
        end
    next
end

# DNS de los DHCP 10 y 30: apuntan al propio FortiGate para que funcione HOY.
# Cuando exista el DC/AD, cambiar dns-server1 por su IP (ej 10.10.20.10).


#=============================================================================
#  6 · ACCESO TEMPORAL A INTERNET POR internal4  (puerto 4)
#     Red 192.168.4.0/24, fuera del plan del proyecto para que se note que
#     es provisoria. La seccion 11 la desarma.
#=============================================================================

config system interface
    edit "internal4"
        set alias "TEMP-INTERNET"
        set mode static
        set ip 192.168.4.1 255.255.255.0
        set allowaccess ping https ssh
        set role lan
        set description "TEMPORAL - borrar al conectar los switches"
    next
end

config system dhcp server
    edit 99
        set interface "internal4"
        set default-gateway 192.168.4.1
        set netmask 255.255.255.0
        set dns-service default
        set lease-time 3600
        config ip-range
            edit 1
                set start-ip 192.168.4.50
                set end-ip 192.168.4.200
            next
        end
    next
end


#=============================================================================
#  7 · OBJETOS
#=============================================================================

config firewall address
    edit "NET-USERS"
        set subnet 10.10.10.0 255.255.255.0
    next
    edit "NET-SERVERS"
        set subnet 10.10.20.0 255.255.255.0
    next
    edit "NET-PVEMGMT"
        set subnet 10.10.25.0 255.255.255.0
    next
    edit "NET-WIFICORP"
        set subnet 10.10.30.0 255.255.255.0
    next
    edit "NET-WIFIGUEST"
        set subnet 10.10.35.0 255.255.255.0
    next
    edit "NET-IOT"
        set subnet 10.10.50.0 255.255.255.0
    next
    edit "NET-MGMT-VL60"
        set subnet 10.10.60.0 255.255.255.0
    next
    edit "NET-MGMT-LEGACY"
        set subnet 192.168.1.0 255.255.255.0
        set comment "Gestion / rescate - internal1"
    next
    edit "NET-TEMP-INTERNET"
        set subnet 192.168.4.0 255.255.255.0
        set comment "TEMPORAL - internal4"
    next
end

config firewall addrgrp
    edit "GRP-LAN-INTERNA"
        set member "NET-USERS" "NET-SERVERS" "NET-PVEMGMT" "NET-WIFICORP" "NET-IOT" "NET-MGMT-VL60" "NET-MGMT-LEGACY" "NET-TEMP-INTERNET"
        set comment "Todo lo interno - usado en el deny de invitados"
    next
end

config firewall service custom
    edit "PVE-WEB"
        set tcp-portrange 8006
    next
    edit "PVE-SPICE"
        set tcp-portrange 3128
    next
    edit "PRINT-RAW"
        set tcp-portrange 9100-9102 515 631
    next
    edit "SAP-DIAG"
        set tcp-portrange 3200-3299
    next
    edit "SAP-GW"
        set tcp-portrange 3300-3399
    next
    edit "SAP-MSG"
        set tcp-portrange 3600-3699
    next
end

config firewall service group
    edit "GRP-SERVIDORES-LAN"
        set member "SMB" "DNS" "LDAP" "KERBEROS" "HTTP" "HTTPS" "RDP" "PING" "SAP-DIAG" "SAP-GW" "SAP-MSG"
    next
    edit "GRP-PVE-ADMIN"
        set member "PVE-WEB" "PVE-SPICE" "SSH" "HTTPS" "PING"
    next
    edit "GRP-SALIDA-SERVIDORES"
        set member "DNS" "HTTP" "HTTPS" "NTP"
    next
end

config firewall shaper traffic-shaper
    edit "GUEST-20M"
        set maximum-bandwidth 20000
        set bandwidth-unit kbps
        set priority low
    next
end


#=============================================================================
#  8 · POLITICAS
#     Se borra primero la 999 para que, al recrearla al final, quede ultima.
#     Si no, FortiOS agrega las politicas nuevas DESPUES del deny y no
#     se evalua ninguna.
#=============================================================================

config firewall policy
    delete 999
end

config firewall policy

    edit 5
        set name "MGMT-RESCATE->SDWAN"
        set srcintf "internal"
        set dstintf "SDWAN"
        set action accept
        set srcaddr "NET-MGMT-LEGACY"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set nat enable
        set logtraffic all
        set comments "Puerto de rescate - registrar licencias y updates"
    next

    edit 90
        set name "TEMP-INTERNET-internal4"
        set srcintf "internal4"
        set dstintf "SDWAN"
        set action accept
        set srcaddr "NET-TEMP-INTERNET"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set nat enable
        set logtraffic all
        set comments "TEMPORAL - borrar al conectar los switches"
    next

    edit 10
        set name "USERS->INTERNET"
        set srcintf "VL10-USERS"
        set dstintf "SDWAN"
        set action accept
        set srcaddr "NET-USERS"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set nat enable
        set utm-status enable
        set av-profile "default"
        set ips-sensor "default"
        set webfilter-profile "default"
        set application-list "default"
        set dnsfilter-profile "default"
        set ssl-ssh-profile "certificate-inspection"
        set logtraffic all
    next

    edit 11
        set name "WIFICORP->INTERNET"
        set srcintf "VL30-WIFICORP"
        set dstintf "SDWAN"
        set action accept
        set srcaddr "NET-WIFICORP"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set nat enable
        set utm-status enable
        set av-profile "default"
        set ips-sensor "default"
        set webfilter-profile "default"
        set application-list "default"
        set dnsfilter-profile "default"
        set ssl-ssh-profile "certificate-inspection"
        set logtraffic all
    next

    edit 12
        set name "GUEST-DENY-LAN"
        set srcintf "VL35-WIFIGUEST"
        set dstintf "any"
        set action deny
        set srcaddr "NET-WIFIGUEST"
        set dstaddr "GRP-LAN-INTERNA"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next

    edit 13
        set name "GUEST->INTERNET"
        set srcintf "VL35-WIFIGUEST"
        set dstintf "SDWAN"
        set action accept
        set srcaddr "NET-WIFIGUEST"
        set dstaddr "all"
        set schedule "always"
        set service "DNS" "HTTP" "HTTPS"
        set nat enable
        set utm-status enable
        set webfilter-profile "default"
        set application-list "default"
        set ssl-ssh-profile "certificate-inspection"
        set traffic-shaper "GUEST-20M"
        set traffic-shaper-reverse "GUEST-20M"
        set logtraffic all
    next

    edit 20
        set name "USERS->SERVERS"
        set srcintf "VL10-USERS" "VL30-WIFICORP"
        set dstintf "VL20-SERVERS"
        set action accept
        set srcaddr "NET-USERS" "NET-WIFICORP"
        set dstaddr "NET-SERVERS"
        set schedule "always"
        set service "GRP-SERVIDORES-LAN"
        set utm-status enable
        set ips-sensor "default"
        set logtraffic all
    next

    edit 40
        set name "SERVERS->INTERNET"
        set srcintf "VL20-SERVERS" "VL25-PVEMGMT"
        set dstintf "SDWAN"
        set action accept
        set srcaddr "NET-SERVERS" "NET-PVEMGMT"
        set dstaddr "all"
        set schedule "always"
        set service "GRP-SALIDA-SERVIDORES"
        set nat enable
        set utm-status enable
        set av-profile "default"
        set ips-sensor "default"
        set ssl-ssh-profile "certificate-inspection"
        set logtraffic all
    next

    edit 50
        set name "ADMIN->PVE"
        set srcintf "VL60-MGMT" "VL10-USERS" "internal"
        set dstintf "VL25-PVEMGMT"
        set action accept
        set srcaddr "NET-MGMT-VL60" "NET-USERS" "NET-MGMT-LEGACY"
        set dstaddr "NET-PVEMGMT"
        set schedule "always"
        set service "GRP-PVE-ADMIN"
        set logtraffic all
    next

    edit 60
        set name "USERS->IOT"
        set srcintf "VL10-USERS" "VL30-WIFICORP"
        set dstintf "VL50-IOT"
        set action accept
        set srcaddr "NET-USERS" "NET-WIFICORP"
        set dstaddr "NET-IOT"
        set schedule "always"
        set service "HTTP" "HTTPS" "PING" "SMB" "PRINT-RAW"
        set logtraffic all
    next

    edit 61
        set name "IOT-DENY-INTERNET"
        set srcintf "VL50-IOT"
        set dstintf "SDWAN"
        set action deny
        set srcaddr "NET-IOT"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next

    edit 999
        set name "DENY-ALL-LOG"
        set srcintf "any"
        set dstintf "any"
        set action deny
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end


