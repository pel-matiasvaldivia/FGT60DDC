    - high-priority:
        maximum-bandwidth: 1048576
        per-policy: enable

    - medium-priority:
        maximum-bandwidth: 1048576
        priority: medium
        per-policy: enable

    - low-priority:
        maximum-bandwidth: 1048576
        priority: low
        per-policy: enable

    - guarantee-100kbps:
        guaranteed-bandwidth: 100
