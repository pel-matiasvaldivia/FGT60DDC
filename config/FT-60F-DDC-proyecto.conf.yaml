    - 1:

    - 2:

    - 3:

    - 4:

    - 5:

    - 6:

    - 7:


system_email-server:
    server: "notification.fortinet.net"
    port: 465
    security: smtps

system_session-helper:
    - 1:
        name: pptp
        protocol: 6
        port: 1723

    - 2:
        name: h323
        protocol: 6
        port: 1720

    - 3:
        name: ras
        protocol: 17
        port: 1719

    - 4:
        name: tns
        protocol: 6
        port: 1521

    - 5:
        name: tftp
        protocol: 17
        port: 69

    - 6:
        name: rtsp
        protocol: 6
        port: 554

    - 7:
        name: rtsp
        protocol: 6
        port: 7070

    - 8:
        name: rtsp
        protocol: 6
        port: 8554

    - 9:
        name: ftp
        protocol: 6
        port: 21

    - 10:
        name: mms
        protocol: 6
        port: 1863

    - 11:
        name: pmap
        protocol: 6
        port: 111

    - 12:
        name: pmap
        protocol: 17
        port: 111

    - 13:
