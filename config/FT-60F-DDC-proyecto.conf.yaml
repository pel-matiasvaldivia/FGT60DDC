waf_profile:
    - default:
        signature:
            main-class_100000000:
                action: block
                severity: high

            main-class_20000000:

            main-class_30000000:
                status: enable
                action: block
                severity: high

            main-class_40000000:

            main-class_50000000:
                status: enable
                action: block
                severity: high

            main-class_60000000:

            main-class_70000000:
                status: enable
                action: block
                severity: high

            main-class_80000000:
                status: enable
                severity: low

            main-class_110000000:
                status: enable
                severity: high

            main-class_90000000:
                status: enable
                action: block
                severity: high

            disabled-signature: 80080005 80200001 60030001 60120001 80080003 90410001 90410002

        constraint:
            header-length:
                status: enable
                log: enable
                severity: low

            content-length:
                status: enable
                log: enable
                severity: low

            param-length:
                status: enable
                log: enable
                severity: low

            line-length:
                status: enable
                log: enable
                severity: low

            url-param-length:
                status: enable
                log: enable
                severity: low

            version:
                log: enable

            method:
                action: block
                log: enable

            hostname:
                action: block
                log: enable

            malformed:
                log: enable

            max-cookie:
                status: enable
                log: enable
                severity: low

            max-header-line:
                status: enable
                log: enable
                severity: low

            max-url-param:
                status: enable
                log: enable
                severity: low

            max-range-segment:
                status: enable
                log: enable
                severity: high




vpn_ipsec_phase1-interface:
    - VPN-SAP:
        interface: "wan1"
        ike-version: 2
        keylife: 28800
        peertype: any
        net-device: disable
        proposal: aes256-sha256 aes128-sha256
        dhgrp: 14
        remote-gw: 0.0.0.0
        psksecret: "COMPLETAR-PSK-DE-SAP"
        dpd: on-idle
        dpd-retryinterval: 30
        comments: "COMPLETAR remote-gw y psksecret con los datos del proveedor"


vpn_ipsec_phase2-interface:
    - VPN-SAP-P2-SRV:
        phase1name: "VPN-SAP"
        proposal: aes256-sha256 aes128-sha256
        dhgrp: 14
        pfs: enable
        keylifeseconds: 3600
        src-subnet: 10.10.20.0 255.255.255.0
        dst-subnet: 0.0.0.0 0.0.0.0

    - VPN-SAP-P2-USR:
        phase1name: "VPN-SAP"
        proposal: aes256-sha256 aes128-sha256
        dhgrp: 14
        pfs: enable
        keylifeseconds: 3600
        src-subnet: 10.10.10.0 255.255.255.0
        dst-subnet: 0.0.0.0 0.0.0.0


firewall_policy:
    - 5:
        name: "MGMT-RESCATE->SDWAN"
        srcintf: "internal"
        dstintf: "SDWAN"
        action: accept
        srcaddr: "NET-MGMT-LEGACY"
        dstaddr: "all"
        schedule: "always"
        service: "ALL"
        logtraffic: all
        nat: enable
        comments: "Puerto de rescate - permite registrar licencias y updates"

    - 10:
        name: "USERS->INTERNET"
        srcintf: "VL10-USERS"
        dstintf: "SDWAN"
        action: accept
        srcaddr: "NET-USERS"
        dstaddr: "all"
        schedule: "always"
        service: "ALL"
        utm-status: enable
        ssl-ssh-profile: "certificate-inspection"
        av-profile: "default"
        webfilter-profile: "default"
        dnsfilter-profile: "default"
        ips-sensor: "default"
        application-list: "default"
        logtraffic: all
        nat: enable

    - 11:
        name: "WIFICORP->INTERNET"
        srcintf: "VL30-WIFICORP"
        dstintf: "SDWAN"
        action: accept
        srcaddr: "NET-WIFICORP"
        dstaddr: "all"
        schedule: "always"
        service: "ALL"
        utm-status: enable
        ssl-ssh-profile: "certificate-inspection"
        av-profile: "default"
        webfilter-profile: "default"
        dnsfilter-profile: "default"
        ips-sensor: "default"
        application-list: "default"
        logtraffic: all
        nat: enable

    - 12:
        name: "GUEST-DENY-LAN"
        srcintf: "VL35-WIFIGUEST"
        dstintf: "any"
        action: deny
        srcaddr: "NET-WIFIGUEST"
        dstaddr: "GRP-LAN-INTERNA"
        schedule: "always"
        service: "ALL"
        logtraffic: all

    - 13:
        name: "GUEST->INTERNET"
        srcintf: "VL35-WIFIGUEST"
        dstintf: "SDWAN"
        action: accept
        srcaddr: "NET-WIFIGUEST"
        dstaddr: "all"
        schedule: "always"
        service: "DNS" "HTTP" "HTTPS"
        utm-status: enable
        ssl-ssh-profile: "certificate-inspection"
        webfilter-profile: "default"
        application-list: "default"
        traffic-shaper: "GUEST-20M"
        traffic-shaper-reverse: "GUEST-20M"
        logtraffic: all
        nat: enable

    - 20:
        name: "USERS->SERVERS"
        srcintf: "VL10-USERS" "VL30-WIFICORP"
        dstintf: "VL20-SERVERS"
        action: accept
        srcaddr: "NET-USERS" "NET-WIFICORP"
        dstaddr: "NET-SERVERS"
        schedule: "always"
        service: "GRP-SERVIDORES-LAN"
        utm-status: enable
        ssl-ssh-profile: "certificate-inspection"
        ips-sensor: "default"
        logtraffic: all

    - 30:
        name: "LAN->SAP-IPSEC"
        srcintf: "VL10-USERS" "VL30-WIFICORP" "VL20-SERVERS"
        dstintf: "VPN-SAP"
        action: accept
        srcaddr: "NET-USERS" "NET-WIFICORP" "NET-SERVERS"
        dstaddr: "NET-SAP"
        schedule: "always"
        service: "GRP-SAP"
        utm-status: enable
        ssl-ssh-profile: "certificate-inspection"
        ips-sensor: "default"
        logtraffic: all

    - 31:
        name: "SAP-IPSEC->SERVERS"
        srcintf: "VPN-SAP"
        dstintf: "VL20-SERVERS"
        action: accept
        srcaddr: "NET-SAP"
        dstaddr: "NET-SERVERS"
        schedule: "always"
        service: "PING"
        logtraffic: all
        comments: "Arranca solo con PING. Abrir servicios de a uno, nunca ALL"

    - 40:
        name: "SERVERS->INTERNET"
        srcintf: "VL20-SERVERS" "VL25-PVEMGMT"
        dstintf: "SDWAN"
        action: accept
        srcaddr: "NET-SERVERS" "NET-PVEMGMT"
        dstaddr: "all"
        schedule: "always"
        service: "GRP-SALIDA-SERVIDORES"
        utm-status: enable
        ssl-ssh-profile: "certificate-inspection"
        av-profile: "default"
        ips-sensor: "default"
        logtraffic: all
        nat: enable
        comments: "Sin navegacion libre: updates, licencias y NTP"

    - 50:
        name: "ADMIN->PVE"
        srcintf: "VL60-MGMT" "VL10-USERS" "internal"
        dstintf: "VL25-PVEMGMT"
        action: accept
        srcaddr: "NET-MGMT-VL60" "NET-USERS" "NET-MGMT-LEGACY"
        dstaddr: "NET-PVEMGMT"
        schedule: "always"
        service: "GRP-PVE-ADMIN"
        logtraffic: all
        comments: "Acotar NET-USERS a un grupo de IPs de soporte"

    - 60:
        name: "USERS->IOT"
        srcintf: "VL10-USERS" "VL30-WIFICORP"
        dstintf: "VL50-IOT"
        action: accept
        srcaddr: "NET-USERS" "NET-WIFICORP"
        dstaddr: "NET-IOT"
        schedule: "always"
        service: "HTTP" "HTTPS" "PING" "SMB" "PRINT-RAW"
        logtraffic: all

    - 61:
        name: "IOT-DENY-INTERNET"
        srcintf: "VL50-IOT"
        dstintf: "SDWAN"
        action: deny
        srcaddr: "NET-IOT"
        dstaddr: "all"
        schedule: "always"
        service: "ALL"
        logtraffic: all

    - 999:
        name: "DENY-ALL-LOG"
        srcintf: "any"
        dstintf: "any"
        action: deny
        srcaddr: "all"
        dstaddr: "all"
        schedule: "always"
        service: "ALL"
        logtraffic: all


