#
#  ============================================================================
#  ARCHIVO MODIFICADO - NO ES EL BACKUP ORIGINAL
#  Base: FT-60F-DDC_7-2_1575_202610141133   ·   Generado: 2026-10-20
#  ============================================================================
#
#  CONTIENE el diseno completo del proyecto:
#    - Limpieza de las redes de prueba (VLAN 100 LAN-ETH, LAN-WIFI, IP del dmz)
#    - VLAN 10/30/35/50/60 sobre internal2 (trunk de acceso)
#    - VLAN 20/25 sobre internal3 (trunk de servidores)
#    - WAN1 estatica + SD-WAN + ruta default
#    - Tunel IPsec a SAP (incompleto a proposito, ver abajo)
#    - 13 politicas de firewall
#
#  ACCESO PRESERVADO: la interfaz "internal" (192.168.1.99/24, HTTPS+SSH), su
#  miembro internal1, el DHCP server 1 y el usuario admin quedan SIN CAMBIOS.
#
#  ---------------------------------------------------------------------------
#  ANTES DE RESTAURAR - LEER
#  ---------------------------------------------------------------------------
#  1. Una restauracion REEMPLAZA toda la configuracion y REINICIA el equipo.
#  2. Este archivo esta en formato YAML. El backup YAML de FortiOS es un
#     formato de lectura y auditoria: VERIFICAR en el propio equipo que acepte
#     restaurarlo antes de depender de el. Si no lo acepta, usar
#     fortigate-60f-puesta-a-punto.conf por CLI, que hace exactamente lo mismo.
#  3. HAY VALORES INCOMPLETOS a proposito. Completar ANTES de restaurar:
#       vpn_ipsec_phase1-interface -> remote-gw y psksecret
#       vpn_ipsec_phase2-interface -> dst-subnet (x2)
#       firewall_address NET-SAP   -> subnet
#       router_static 2            -> dst
#       system_dhcp_server 10 y 30 -> dns-server1 (hoy 10.10.20.10)
#       system_global              -> timezone (hoy 04, verificar)
#     La ruta estatica 2 se dejo con status: disable justamente para que un
#     restore descuidado no genere una default por el tunel y corte internet.
#     Habilitarla recien con el dst correcto cargado.
#  4. El password del admin NO esta en este archivo: se mantiene el actual.
#  5. Los trusthost del admin NO se aplican aca a proposito. Ver la etapa 9
#     del script CLI: es la causa numero uno de bloqueos.
#
system_global:
    alias: "FortiGate-60F"
    hostname: "FT-60F-DDC"
    switch-controller: enable
    timezone: 04
    virtual-switch-vlan: enable

system_accprofile:
    - prof_admin:
        secfabgrp: read-write
        ftviewgrp: read-write
        authgrp: read-write
        sysgrp: read-write
        netgrp: read-write
        loggrp: read-write
        fwgrp: read-write
        vpngrp: read-write
        utmgrp: read-write
        wifi: read-write


system_np6xlite:
    - np6xlite_0:


system_interface:
    - wan1:
        vdom: "root"
        mode: static
        ip: 209.13.181.178 255.255.255.240
        allowaccess: ping
        type: physical
        alias: "ISP-TELEFONICA"
        role: wan
        snmp-index: 1

    - wan2:
        vdom: "root"
        mode: dhcp
        allowaccess: ping fgfm
        type: physical
        role: wan
        snmp-index: 2

    - dmz:
        vdom: "root"
        allowaccess: ping
        type: physical
        alias: "DMZ-LIBRE"
        role: dmz
        snmp-index: 3

    - internal1:
        vdom: "root"
        type: physical
        snmp-index: 4

    - internal2:
        vdom: "root"
        type: physical
        alias: "TRUNK-ACCESO"
        description: "802.1Q al switch de acceso - VLAN 10,30,35,50,60"
        snmp-index: 5

    - internal3:
        vdom: "root"
        type: physical
        alias: "TRUNK-SERVIDORES"
        description: "802.1Q al switch de servidores - VLAN 20,25"
        snmp-index: 6

    - internal4:
        vdom: "root"
        type: physical
        snmp-index: 7

    - internal5:
        vdom: "root"
        type: physical
        snmp-index: 8

    - a:
        vdom: "root"
        type: physical
        snmp-index: 9

    - b:
        vdom: "root"
        type: physical
        snmp-index: 10

    - modem:
        vdom: "root"
        mode: pppoe
        status: down
        type: physical
        snmp-index: 11

    - naf.root:
        vdom: "root"
        type: tunnel
        src-check: disable
        snmp-index: 12

    - l2t.root:
        vdom: "root"
        type: tunnel
        snmp-index: 13

    - ssl.root:
        vdom: "root"
        type: tunnel
        alias: "SSL VPN interface"
        snmp-index: 14

    - internal:
        vdom: "root"
        ip: 192.168.1.99 255.255.255.0
        allowaccess: ping https ssh fgfm fabric
        type: hard-switch
        stp: enable
        role: lan
        snmp-index: 15

    - fortilink:
        vdom: "root"
        fortilink: enable
        ip: 10.255.1.1 255.255.255.0
        allowaccess: ping fabric
        type: aggregate
        member: "a" "b"
        lldp-reception: enable
        lldp-transmission: enable
        snmp-index: 16


    - VL10-USERS:
        vdom: "root"
        ip: 10.10.10.1 255.255.255.0
        allowaccess: ping
        alias: "USUARIOS"
        device-identification: enable
        role: lan
        snmp-index: 20
        interface: "internal2"
        vlanid: 10

    - VL30-WIFICORP:
        vdom: "root"
        ip: 10.10.30.1 255.255.255.0
        allowaccess: ping
        alias: "WIFI-CORP"
        device-identification: enable
        role: lan
        snmp-index: 21
        interface: "internal2"
        vlanid: 30

    - VL35-WIFIGUEST:
        vdom: "root"
        ip: 10.10.35.1 255.255.255.0
        allowaccess: ping
        alias: "WIFI-INVITADOS"
        role: lan
        snmp-index: 22
        interface: "internal2"
        vlanid: 35

    - VL50-IOT:
        vdom: "root"
        ip: 10.10.50.1 255.255.255.0
        allowaccess: ping
        alias: "IOT-IMPRESORAS"
        role: lan
        snmp-index: 23
        interface: "internal2"
        vlanid: 50

    - VL60-MGMT:
        vdom: "root"
        ip: 10.10.60.1 255.255.255.0
        allowaccess: ping https ssh snmp
        alias: "MGMT"
        role: lan
        snmp-index: 24
        interface: "internal2"
        vlanid: 60

    - VL20-SERVERS:
        vdom: "root"
        ip: 10.10.20.1 255.255.255.0
        allowaccess: ping
        alias: "SERVIDORES"
        role: lan
        snmp-index: 25
        interface: "internal3"
        vlanid: 20

    - VL25-PVEMGMT:
        vdom: "root"
        ip: 10.10.25.1 255.255.255.0
        allowaccess: ping
        alias: "PVE-MGMT"
        role: lan
        snmp-index: 26
        interface: "internal3"
        vlanid: 25


