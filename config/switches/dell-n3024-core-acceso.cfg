!=============================================================================
!  SW-CORE-ACC  —  Dell Networking N3024  (DNOS 6.x)
!  Proyecto FT-60F-DDC   ·   Switch de distribucion del acceso
!
!  ROL: unico switch con VLANs del lado del acceso. Concentra el uplink al
!       FortiGate, los access points y las impresoras, y da acceso a los
!       3 switches SMC (que quedan planos, sin VLANs).
!
!  MAPA DE PUERTOS
!    Gi1/0/1      UPLINK al FortiGate internal2    TRUNK 10,30,35,50,60
!    Gi1/0/2-4    Bajada a SMC-01/02/03            ACCESS VLAN 10
!    Gi1/0/5-8    4 Access Points                  TRUNK 30,35 + nativa 60
!    Gi1/0/9-13   Impresoras / CCTV / IoT          ACCESS VLAN 50
!    Gi1/0/14-24  11 puestos de trabajo            ACCESS VLAN 10
!
!  POR CONSOLA. Guardar al final con: copy running-config startup-config
!=============================================================================

configure

!-----------------------------------------------------------------------------
! 1. Identidad y modo
!-----------------------------------------------------------------------------
hostname "SW-CORE-ACC"

! Capa 2 pura: el ruteo entre VLANs lo hace el FortiGate. Si el switch rutea
! por su cuenta, el trafico esquiva el firewall y las politicas no se aplican.
no ip routing

spanning-tree
spanning-tree mode rstp

! Este switch es la RAIZ del arbol: es el que tiene el uplink al firewall.
! Si la raiz quedara en un SMC, el trafico daria vueltas de mas.
spanning-tree priority 4096

!-----------------------------------------------------------------------------
! 2. VLANs
!-----------------------------------------------------------------------------
vlan 10,30,35,50,60,999

vlan 10
    name "USERS"
    exit
vlan 30
    name "WIFI-CORP"
    exit
vlan 35
    name "WIFI-GUEST"
    exit
vlan 50
    name "IOT-PRINT"
    exit
vlan 60
    name "MGMT"
    exit
vlan 999
    name "NATIVE-UNUSED"
    exit

!-----------------------------------------------------------------------------
! 3. Gi1/0/1  —  UPLINK AL FORTIGATE (puerto 2 del FGT)
!-----------------------------------------------------------------------------
interface Gi1/0/1
    description "UPLINK-FORTIGATE-internal2"
    switchport mode trunk
    switchport trunk native vlan 999
    switchport trunk allowed vlan 10,30,35,50,60
    ! Un uplink NO es puerto de borde: sin portfast y sin bpduguard.
    exit

!-----------------------------------------------------------------------------
! 4. Gi1/0/2-4  —  BAJADA A LOS 3 SMC   (access VLAN 10)
!    Los SMC estan planos: mandan todo SIN etiqueta y este puerto les pone
!    la VLAN 10. Toda la inteligencia de VLANs vive de este lado.
!-----------------------------------------------------------------------------
interface range Gi1/0/2-4
    description "DOWNLINK-SMC-ACCESO"
    switchport mode access
    switchport access vlan 10
    ! IMPORTANTE: del otro lado hay un SWITCH, no un equipo final.
    ! NO poner portfast ni bpduguard: bpduguard apagaria el puerto al recibir
    ! los BPDU del SMC, que son legitimos y necesarios para evitar bucles.
    exit

!-----------------------------------------------------------------------------
! 5. Gi1/0/5-8  —  ACCESS POINTS
!    Puerto mixto: los SSID viajan ETIQUETADOS (30 y 35) porque el AP decide
!    la VLAN segun el SSID; la administracion del AP va SIN etiqueta en la
!    VLAN 60, asi toma IP apenas se enchufa.
!-----------------------------------------------------------------------------
interface range Gi1/0/5-8
    description "ACCESS-POINT"
    switchport mode trunk
    switchport trunk native vlan 60
    switchport trunk allowed vlan 30,35,60
    spanning-tree portfast
    exit

! --- Si los Dell son modelo N3024P (con PoE), descomentar:
! interface range Gi1/0/5-8
!     power inline auto
!     exit
! Si son N3024 sin PoE, los 4 AP necesitan inyectores 802.3at.

!-----------------------------------------------------------------------------
! 6. Gi1/0/9-13  —  IMPRESORAS / CCTV / IoT
!-----------------------------------------------------------------------------
interface range Gi1/0/9-13
    description "IMPRESORAS-IOT"
    switchport mode access
    switchport access vlan 50
    spanning-tree portfast
    spanning-tree bpduguard enable
    exit

!-----------------------------------------------------------------------------
! 7. Gi1/0/14-24  —  PUESTOS DE TRABAJO
!-----------------------------------------------------------------------------
interface range Gi1/0/14-24
    description "PUESTOS"
    switchport mode access
    switchport access vlan 10
    spanning-tree portfast
    spanning-tree bpduguard enable
    exit

! bpduguard: si alguien enchufa un router o un switch casero en un puesto,
! el puerto se apaga en lugar de alterar el arbol de toda la red.
! Para reactivarlo:  show errdisable   /   no shutdown

!-----------------------------------------------------------------------------
! 8. Gestion
!-----------------------------------------------------------------------------
interface vlan 60
    ip address 10.10.60.2 255.255.255.0
    exit

ip default-gateway 10.10.60.1

ip ssh server
ip ssh protocol 2
no ip telnet server

username "admin" password <PASSWORD> privilege 15
enable password <PASSWORD-ENABLE>

clock timezone -3 minutes 0
sntp unicast client enable
sntp server 10.10.60.1

exit

!=============================================================================
!  GUARDAR  —  sin esto se pierde todo al reiniciar
!=============================================================================
copy running-config startup-config

!=============================================================================
!  VERIFICACION
!=============================================================================
!   show vlan
!   show interfaces switchport Gi1/0/1       <- el uplink: 10,30,35,50,60
!   show interfaces switchport Gi1/0/2       <- hacia el SMC: access 10
!   show interfaces status
!   show spanning-tree brief                 <- este switch debe ser la raiz
!   show mac address-table vlan 10
!
!  PRUEBA: notebook en Gi1/0/14 -> debe tomar 10.10.10.x y navegar.
!=============================================================================
