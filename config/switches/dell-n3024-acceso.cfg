!=============================================================================
!  SW-ACCESO  -  Dell Networking N3024 / N3024P  (DNOS 6.x)
!  Proyecto FT-60F-DDC
!
!  ROL: switch(es) de acceso. 80 desktops + 4 AP + impresoras/IoT.
!       Puro capa 2. El ruteo entre VLANs lo hace el FortiGate.
!
!  CONEXION AL FIREWALL:  uplink -> FortiGate internal2 (TRUNK)
!                         VLANs permitidas: 10,30,35,50,60
!
!  ANTES DE PEGAR:
!    show version          -> confirmar modelo y version de firmware
!    show switch           -> ver unidades del stack
!    copy running-config startup-config   (backup antes de tocar)
!
!  Esta config asume un STACK de 4 unidades (Gi1/0/x .. Gi4/0/x).
!  Si son switches independientes, repetir en cada uno cambiando solo
!  la IP de gestion y el nombre de host.
!=============================================================================

configure

!-----------------------------------------------------------------------------
! 1. Identidad y modo de operacion
!-----------------------------------------------------------------------------
hostname "SW-ACC-01"

! Capa 2 pura: el ruteo entre VLANs es responsabilidad del FortiGate.
! Si el switch rutea por su cuenta, el trafico esquiva el firewall.
no ip routing

! RSTP. Verificar el modo por defecto del firmware con: show spanning-tree
spanning-tree mode rstp
spanning-tree

!-----------------------------------------------------------------------------
! 2. VLANs
!-----------------------------------------------------------------------------
vlan 10,30,35,50,60,999

vlan 10
    name "USERS"
    exit
vlan 30
    name "WIFI-CORP"
    exit
vlan 35
    name "WIFI-GUEST"
    exit
vlan 50
    name "IOT-PRINT"
    exit
vlan 60
    name "MGMT"
    exit
vlan 999
    name "NATIVE-UNUSED"
    exit

! VLAN 999 no transporta nada: se usa como nativa de los trunks para que
! ninguna trama sin etiqueta caiga en una VLAN con datos reales.

!-----------------------------------------------------------------------------
! 3. UPLINK AL FORTIGATE  (Gi1/0/24 -> FortiGate internal2)
!-----------------------------------------------------------------------------
interface Gi1/0/24
    description "UPLINK-FORTIGATE-internal2"
    switchport mode trunk
    switchport trunk native vlan 999
    switchport trunk allowed vlan 10,30,35,50,60
    ! Un uplink NO es un puerto de borde: sin portfast y sin bpduguard.
    exit

! --- OPCIONAL: uplink de 2 cables con LACP (Gi1/0/23 + Gi1/0/24) ------------
! Requiere configurar tambien el agregado en el FortiGate. Si se usa,
! BORRAR la configuracion individual de Gi1/0/24 de arriba.
!
! interface port-channel 1
!     description "UPLINK-FORTIGATE-LACP"
!     switchport mode trunk
!     switchport trunk native vlan 999
!     switchport trunk allowed vlan 10,30,35,50,60
!     exit
! interface range Gi1/0/23-24
!     channel-group 1 mode active
!     exit

!-----------------------------------------------------------------------------
! 4. PUESTOS DE TRABAJO  -  VLAN 10
!    Unidad 1: Gi1/0/1-20     Unidad 2: Gi2/0/1-22
!    Unidad 3: Gi3/0/1-22     Unidad 4: Gi4/0/1-22      = 86 bocas
!-----------------------------------------------------------------------------
interface range Gi1/0/1-20
    description "PUESTOS"
    switchport mode access
    switchport access vlan 10
    spanning-tree portfast
    spanning-tree bpduguard enable
    exit

interface range Gi2/0/1-22
    description "PUESTOS"
    switchport mode access
    switchport access vlan 10
    spanning-tree portfast
    spanning-tree bpduguard enable
    exit

interface range Gi3/0/1-22
    description "PUESTOS"
    switchport mode access
    switchport access vlan 10
    spanning-tree portfast
    spanning-tree bpduguard enable
    exit

interface range Gi4/0/1-20
    description "PUESTOS"
    switchport mode access
    switchport access vlan 10
    spanning-tree portfast
    spanning-tree bpduguard enable
    exit

! bpduguard: si alguien enchufa un switch casero o un router en un puesto,
! el puerto se apaga en lugar de alterar el spanning-tree de toda la red.
! Para reactivar un puerto caido:  show errdisable  /  no shutdown

!-----------------------------------------------------------------------------
! 5. ACCESS POINTS  -  Gi1/0/21-22 y Gi4/0/21-22
!    Puerto MIXTO: los SSID viajan etiquetados (30 y 35) y la administracion
!    del propio AP va sin etiqueta en la VLAN 60.
!-----------------------------------------------------------------------------
interface range Gi1/0/21-22
    description "ACCESS-POINT"
    switchport mode trunk
    switchport trunk native vlan 60
    switchport trunk allowed vlan 30,35,60
    spanning-tree portfast
    exit

interface range Gi4/0/21-22
    description "ACCESS-POINT"
    switchport mode trunk
    switchport trunk native vlan 60
    switchport trunk allowed vlan 30,35,60
    spanning-tree portfast
    exit

! --- ALTERNATIVA en modo general (equivalente, por si el firmware no acepta
!     "native vlan" en un trunk):
! interface range Gi1/0/21-22
!     switchport mode general
!     switchport general allowed vlan add 60 untagged
!     switchport general pvid 60
!     switchport general allowed vlan add 30,35 tagged
!     exit

! --- PoE (SOLO en modelos N3024P). En el N3024 sin PoE hacen falta
!     inyectores 802.3at para los AP.
! interface range Gi1/0/21-22
!     power inline auto
!     exit

!-----------------------------------------------------------------------------
! 6. IMPRESORAS / CCTV / IoT  -  VLAN 50
!-----------------------------------------------------------------------------
interface range Gi1/0/23
    description "IMPRESORAS-IOT"
    switchport mode access
    switchport access vlan 50
    spanning-tree portfast
    spanning-tree bpduguard enable
    exit

interface range Gi4/0/22
    description "IMPRESORAS-IOT"
    switchport mode access
    switchport access vlan 50
    spanning-tree portfast
    spanning-tree bpduguard enable
    exit

!-----------------------------------------------------------------------------
! 7. GESTION DEL SWITCH  -  VLAN 60
!-----------------------------------------------------------------------------
interface vlan 60
    ip address 10.10.60.2 255.255.255.0
    exit

! Con "no ip routing" el gateway se define asi. Si el firmware exige
! ip routing habilitado, usar en su lugar:
!     ip route 0.0.0.0 0.0.0.0 10.10.60.1
ip default-gateway 10.10.60.1

! IP de gestion por switch, si NO estan en stack:
!   SW-ACC-01 10.10.60.2   SW-ACC-02 10.10.60.3
!   SW-ACC-03 10.10.60.4   SW-ACC-04 10.10.60.5
!   SW-SRV-01 10.10.60.6

!-----------------------------------------------------------------------------
! 8. Acceso administrativo
!-----------------------------------------------------------------------------
ip ssh server
ip ssh protocol 2
no ip telnet server

username "admin" password <PASSWORD> privilege 15 encrypted
enable password <PASSWORD-ENABLE>

clock timezone -3 minutes 0
sntp unicast client enable
sntp server 10.10.60.1

logging 10.10.60.1
snmp-server community "<COMUNIDAD-SNMP>" ro

exit

!=============================================================================
!  GUARDAR  (sin esto se pierde todo al reiniciar)
!=============================================================================
copy running-config startup-config

!=============================================================================
!  VERIFICACION
!=============================================================================
!   show vlan
!   show interfaces switchport Gi1/0/24      <- el uplink
!   show interfaces status
!   show spanning-tree brief
!   show mac address-table vlan 10
!   show running-config interface Gi1/0/1
!=============================================================================
