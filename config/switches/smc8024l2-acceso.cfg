!=============================================================================
!  SW-ACCESO  —  SMC TigerSwitch SMC8024L2  (24 × 1GbE, L2 administrable)
!  Proyecto FT-60F-DDC
!
!  ROL: switches de acceso. 80 desktops + 4 AP + impresoras/IoT.
!       Puro capa 2. El ruteo entre VLANs lo hace el FortiGate.
!
!  CONEXION AL FIREWALL:  SW-ACC-01 puerto 24 -> FortiGate internal2 (TRUNK)
!                         VLANs permitidas: 10,30,35,50,60
!
!  *** LEER ANTES DE PEGAR ***
!  El CLI del SMC8024L2 es de base Accton y CAMBIA entre versiones de firmware.
!  Esta configuracion es una PLANTILLA en ese dialecto, no un volcado de tu
!  equipo. Procedimiento recomendado:
!     1. Entrar por consola:  show version   /   show running-config
!     2. Probar UN comando de cada bloque y ver si lo acepta.
!     3. Si el CLI difiere, usar la interfaz web: el orden logico de los pasos
!        es el mismo (crear VLANs -> asignar puertos -> IP de gestion).
!  Donde hay variantes conocidas las dejo anotadas como ALTERNATIVA.
!
!  Guardar SIEMPRE al final:  copy running-config startup-config
!=============================================================================


!=============================================================================
!  TOPOLOGIA  —  4 switches en ESTRELLA (no en cascada)
!=============================================================================
!
!                        FortiGate internal2
!                               |  TRUNK 10,30,35,50,60
!                        +------+------+
!                        |  SW-ACC-01  |  p24 uplink · p21-23 downlink
!                        +--+---+---+--+  p1-16 puestos · p17-20 AP
!                           |   |   |
!              +------------+   |   +------------+
!              |                |                |
!        +-----+-----+    +-----+-----+    +-----+-----+
!        | SW-ACC-02 |    | SW-ACC-03 |    | SW-ACC-04 |
!        +-----------+    +-----------+    +-----------+
!         p24 uplink       p24 uplink       p24 uplink
!
!  ESTRELLA y no cascada: con la misma cantidad de puertos, un switch caido
!  deja sin red solo a SUS puestos y no a los que cuelgan detras.
!
!  REPARTO DE PUERTOS
!    SW-ACC-01   p1-16 puestos · p17-20 AP · p21-23 downlink · p24 uplink FGT
!    SW-ACC-02   p1-22 puestos · p23 IoT   · p24 uplink a SW-ACC-01 p21
!    SW-ACC-03   p1-22 puestos · p23 IoT   · p24 uplink a SW-ACC-01 p22
!    SW-ACC-04   p1-20 puestos · p21-23 IoT · p24 uplink a SW-ACC-01 p23
!
!    Total: 80 puestos + 4 AP + 5 IoT = 89 bocas. Los 96 puertos quedan
!    EXACTAMENTE ocupados: CERO reserva. Ver docs/08 punto 2.
!
!  IPs DE GESTION (VLAN 60)
!    SW-ACC-01  10.10.60.11      SW-ACC-03  10.10.60.13
!    SW-ACC-02  10.10.60.12      SW-ACC-04  10.10.60.14
!=============================================================================


!=============================================================================
!  BLOQUE 1  —  VLANs   (igual en los 4 switches)
!=============================================================================

configure

vlan database
    vlan 10  name USERS       media ethernet state active
    vlan 30  name WIFI-CORP   media ethernet state active
    vlan 35  name WIFI-GUEST  media ethernet state active
    vlan 50  name IOT-PRINT   media ethernet state active
    vlan 60  name MGMT        media ethernet state active
    vlan 999 name NATIVE-NULL media ethernet state active
    exit

! VLAN 999 no transporta nada: se usa como nativa de los trunks para que
! ninguna trama sin etiqueta caiga en una VLAN con datos reales.
!
! ALTERNATIVA si el firmware no acepta "vlan database":
!     vlan 10
!         name USERS
!         exit


!=============================================================================
!  BLOQUE 2  —  SPANNING TREE   (igual en los 4 switches)
!=============================================================================
!  Con 4 switches interconectados, STP es obligatorio: un patch cord mal
!  puesto entre dos bocas arma un bucle y tira la red entera.

spanning-tree
spanning-tree mode rstp

! ALTERNATIVA: si el firmware no soporta RSTP, dejar solo "spanning-tree"
! (802.1D clasico). Converge mas lento pero protege igual del bucle.
!
! SOLO en SW-ACC-01: forzarlo como raiz del arbol. El switch que tiene el
! uplink al firewall debe ser la raiz; si la raiz queda en otro, el trafico
! da vueltas de mas.
!     spanning-tree priority 4096


!=============================================================================
!  BLOQUE 3  —  SW-ACC-01   (el unico con uplink al FortiGate)
!=============================================================================

! --- p24: UPLINK AL FORTIGATE (trunk, todo etiquetado) ----------------------
interface ethernet 1/24
    description UPLINK-FORTIGATE-internal2
    switchport mode trunk
    switchport allowed vlan add 10,30,35,50,60 tagged
    switchport native vlan 999
    switchport allowed vlan remove 1
    exit

! IMPORTANTE: agregar las VLAN nuevas ANTES de sacar la 1. Si se invierte el
! orden, el puerto se queda sin ninguna VLAN y se corta el enlace.

! --- p21-23: DOWNLINK a SW-ACC-02/03/04 (mismas VLANs que el uplink) -------
interface ethernet 1/21
    description DOWNLINK-SW-ACC-02
    switchport mode trunk
    switchport allowed vlan add 10,30,35,50,60 tagged
    switchport native vlan 999
    switchport allowed vlan remove 1
    exit

interface ethernet 1/22
    description DOWNLINK-SW-ACC-03
    switchport mode trunk
    switchport allowed vlan add 10,30,35,50,60 tagged
    switchport native vlan 999
    switchport allowed vlan remove 1
    exit

interface ethernet 1/23
    description DOWNLINK-SW-ACC-04
    switchport mode trunk
    switchport allowed vlan add 10,30,35,50,60 tagged
    switchport native vlan 999
    switchport allowed vlan remove 1
    exit

! --- p17-20: ACCESS POINTS --------------------------------------------------
!  Puerto MIXTO: los SSID viajan ETIQUETADOS (VLAN 30 y 35) porque el AP
!  decide la VLAN segun el SSID; la administracion del propio AP va SIN
!  etiqueta en la VLAN 60, asi toma IP apenas se enchufa.

interface ethernet 1/17
    description ACCESS-POINT-1
    switchport mode hybrid
    switchport allowed vlan add 60 untagged
    switchport native vlan 60
    switchport allowed vlan add 30,35 tagged
    switchport allowed vlan remove 1
    exit

interface ethernet 1/18
    description ACCESS-POINT-2
    switchport mode hybrid
    switchport allowed vlan add 60 untagged
    switchport native vlan 60
    switchport allowed vlan add 30,35 tagged
    switchport allowed vlan remove 1
    exit

interface ethernet 1/19
    description ACCESS-POINT-3
    switchport mode hybrid
    switchport allowed vlan add 60 untagged
    switchport native vlan 60
    switchport allowed vlan add 30,35 tagged
    switchport allowed vlan remove 1
    exit

interface ethernet 1/20
    description ACCESS-POINT-4
    switchport mode hybrid
    switchport allowed vlan add 60 untagged
    switchport native vlan 60
    switchport allowed vlan add 30,35 tagged
    switchport allowed vlan remove 1
    exit

! ALTERNATIVA si el firmware no tiene modo "hybrid":
!     switchport mode trunk
!     switchport native vlan 60
!     switchport allowed vlan add 60 untagged
!     switchport allowed vlan add 30,35 tagged
!
! ATENCION PoE: el SMC8024L2 NO entrega PoE. Los 4 AP necesitan inyectores
! 802.3at. Un AP 802.11ax consume 15-20 W.

! --- p1-16: PUESTOS DE TRABAJO ---------------------------------------------
interface ethernet 1/1
    description PUESTO
    switchport mode access
    switchport allowed vlan add 10 untagged
    switchport native vlan 10
    switchport allowed vlan remove 1
    spanning-tree edge-port
    exit

!  REPETIR el bloque anterior para las interfaces 1/2 a 1/16.
!
!  ALTERNATIVA si el firmware soporta rangos (ahorra 15 bloques):
!     interface ethernet 1/1-16
!         switchport mode access
!         switchport allowed vlan add 10 untagged
!         switchport native vlan 10
!         switchport allowed vlan remove 1
!         spanning-tree edge-port
!         exit
!  Probar primero con un rango corto (1/1-2) y verificar con:
!     show interfaces switchport ethernet 1/1
!
!  "spanning-tree edge-port" hace que el puerto pase a reenviar de inmediato
!  en vez de esperar ~30 s. ALTERNATIVA segun firmware:
!     spanning-tree portfast
!     spanning-tree spanning-disabled      <- NO usar: desactiva STP en el
!                                             puerto y habilita bucles

! --- Gestion del switch -----------------------------------------------------
interface vlan 60
    ip address 10.10.60.11 255.255.255.0
    exit

ip default-gateway 10.10.60.1

! *** CUIDADO ***: si estas administrando el switch por su IP de fabrica en
! VLAN 1, este bloque te corta la sesion. Dejalo PARA EL FINAL y hacelo por
! CONSOLA SERIE. El puerto del equipo desde el que administres tiene que
! quedar en VLAN 60, o vas a necesitar pasar por el FortiGate.

exit
copy running-config startup-config


!=============================================================================
!  BLOQUE 4  —  SW-ACC-02 / 03 / 04   (sin uplink al firewall)
!=============================================================================
!  Aplicar los BLOQUES 1 y 2 (VLANs y STP) y despues esto.
!  NO poner "spanning-tree priority 4096" en estos: la raiz es SW-ACC-01.

configure

! --- p24: UPLINK a SW-ACC-01 ------------------------------------------------
interface ethernet 1/24
    description UPLINK-SW-ACC-01
    switchport mode trunk
    switchport allowed vlan add 10,30,35,50,60 tagged
    switchport native vlan 999
    switchport allowed vlan remove 1
    exit

! --- Puestos: p1-22 en SW-ACC-02 y 03 · p1-20 en SW-ACC-04 -----------------
interface ethernet 1/1
    description PUESTO
    switchport mode access
    switchport allowed vlan add 10 untagged
    switchport native vlan 10
    switchport allowed vlan remove 1
    spanning-tree edge-port
    exit

!  REPETIR hasta 1/22 (SW-ACC-02 y SW-ACC-03) o hasta 1/20 (SW-ACC-04).

! --- Impresoras / CCTV / IoT  (VLAN 50) ------------------------------------
!  SW-ACC-02 y 03: puerto 23      SW-ACC-04: puertos 21, 22 y 23
interface ethernet 1/23
    description IMPRESORAS-IOT
    switchport mode access
    switchport allowed vlan add 50 untagged
    switchport native vlan 50
    switchport allowed vlan remove 1
    spanning-tree edge-port
    exit

! --- Gestion ----------------------------------------------------------------
!  SW-ACC-02 -> 10.10.60.12    SW-ACC-03 -> .13    SW-ACC-04 -> .14
interface vlan 60
    ip address 10.10.60.12 255.255.255.0
    exit

ip default-gateway 10.10.60.1

exit
copy running-config startup-config


!=============================================================================
!  BLOQUE 5  —  ENDURECIMIENTO   (los 4 switches, al final)
!=============================================================================

configure

! Acceso administrativo
username admin password 0 <PASSWORD>
enable password level 15 0 <PASSWORD-ENABLE>

no ip http server
ip http secure-server

! SSH, si el firmware lo soporta
ip ssh server

! Telnet: dejarlo habilitado HASTA confirmar que SSH o HTTPS funcionan.
! Si se corta todo, la consola serie es la unica via de entrada.
!     no ip telnet server

! Hora y logs
sntp client
sntp server 10.10.60.1
clock timezone BA hour -3 minute 0

logging on
logging host 10.10.60.1

exit
copy running-config startup-config


!=============================================================================
!  VERIFICACION
!=============================================================================
!   show vlan
!   show interfaces switchport ethernet 1/24     <- el uplink
!   show interfaces status
!   show spanning-tree
!   show mac-address-table
!   show running-config
!   show system
!
!  PRUEBAS, en este orden:
!   1. Notebook en un puerto de puestos -> debe tomar IP 10.10.10.x del
!      FortiGate y navegar.
!   2. Desde esa notebook: ping 10.10.10.1
!   3. Desde la red de gestion: ping 10.10.60.11 .12 .13 .14
!   4. Desconectar y reconectar un downlink -> la red debe seguir; mirar
!      "show spanning-tree" para confirmar que no hay bucle ni puerto
!      bloqueado que no corresponda.
!=============================================================================
