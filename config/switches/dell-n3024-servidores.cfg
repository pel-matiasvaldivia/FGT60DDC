!=============================================================================
!  SW-SERVIDORES  -  Dell Networking N3024 / N3024F  (DNOS 6.x)
!  Proyecto FT-60F-DDC
!
!  ROL: switch de servidores. Cluster Proxmox de 3 nodos.
!       Puro capa 2. Sin ruteo.
!
!  CONEXION AL FIREWALL:  uplink -> FortiGate internal3 (TRUNK)
!                         VLANs permitidas: SOLO 20 y 25
!
!  *** REGLA CENTRAL DEL DISENO ***
!  Las VLAN 90 (corosync) y 91 (storage/migracion) EXISTEN SOLO EN ESTE
!  SWITCH y NO se incluyen en el uplink al FortiGate. Si alguien las agrega
!  "por las dudas", el trafico de cluster gana un camino hacia el firewall
!  y se pierde la garantia del diseno: corosync es sensible al jitter y un
!  firewall ocupado hace que los nodos se reinicien por watchdog.
!  Ver docs/03-proxmox-cluster.md
!=============================================================================

configure

!-----------------------------------------------------------------------------
! 1. Identidad
!-----------------------------------------------------------------------------
hostname "SW-SRV-01"

no ip routing

spanning-tree mode rstp
spanning-tree

!-----------------------------------------------------------------------------
! 2. VLANs
!-----------------------------------------------------------------------------
vlan 20,25,90,91,999

vlan 20
    name "SERVERS"
    exit
vlan 25
    name "PVE-MGMT"
    exit
vlan 90
    name "PVE-CLUSTER-NOROUTE"
    exit
vlan 91
    name "PVE-STORAGE-NOROUTE"
    exit
vlan 999
    name "NATIVE-UNUSED"
    exit

! Los nombres de las VLAN 90 y 91 dicen NOROUTE a proposito: es la senal
! para el proximo que mire esta configuracion.

!-----------------------------------------------------------------------------
! 3. UPLINK AL FORTIGATE  (Gi1/0/24 -> FortiGate internal3)
!    SOLO VLAN 20 y 25. Las 90 y 91 NO van aca.
!-----------------------------------------------------------------------------
interface Gi1/0/24
    description "UPLINK-FORTIGATE-internal3 (SOLO VLAN 20,25)"
    switchport mode trunk
    switchport trunk native vlan 999
    switchport trunk allowed vlan 20,25
    exit

!-----------------------------------------------------------------------------
! 4. NODOS PROXMOX  -  4 NICs por nodo
!
!    PVE-01: Gi1/0/1  Gi1/0/2  Gi1/0/3  Gi1/0/4
!    PVE-02: Gi1/0/5  Gi1/0/6  Gi1/0/7  Gi1/0/8
!    PVE-03: Gi1/0/9  Gi1/0/10 Gi1/0/11 Gi1/0/12
!
!    NIC1 (eno1) -> VLAN 25  mgmt del nodo (vmbr0) + corosync ring1
!    NIC2 (eno2) -> VLAN 20  trafico de las VMs (vmbr1, taggeado)
!    NIC3 (eno3) -> VLAN 90  corosync ring0 dedicado
!    NIC4 (eno4) -> VLAN 91  storage / migracion, MTU 9216
!-----------------------------------------------------------------------------

! --- NIC1 : administracion de los nodos -------------------------------------
interface range Gi1/0/1,Gi1/0/5,Gi1/0/9
    description "PVE-NIC1-MGMT"
    switchport mode access
    switchport access vlan 25
    spanning-tree portfast
    exit

! --- NIC2 : trafico de las VMs (vmbr1 vlan-aware en Proxmox) ---------------
interface range Gi1/0/2,Gi1/0/6,Gi1/0/10
    description "PVE-NIC2-VMS"
    switchport mode trunk
    switchport trunk native vlan 999
    switchport trunk allowed vlan 20,50
    spanning-tree portfast
    exit

! --- NIC3 : corosync ring0. Dedicado, sin ruteo, sin nada mas -------------
interface range Gi1/0/3,Gi1/0/7,Gi1/0/11
    description "PVE-NIC3-COROSYNC-NO-TOCAR"
    switchport mode access
    switchport access vlan 90
    spanning-tree portfast
    exit

! --- NIC4 : storage y migracion en vivo. Jumbo frames ---------------------
interface range Gi1/0/4,Gi1/0/8,Gi1/0/12
    description "PVE-NIC4-STORAGE-MTU9216"
    switchport mode access
    switchport access vlan 91
    spanning-tree portfast
    mtu 9216
    exit

! IMPORTANTE sobre portfast en los nodos: sin el, el puerto tarda ~30 s en
! pasar a forwarding cuando el link se levanta. Ese retardo en un reinicio
! es suficiente para perder quorum y que el cluster expulse al nodo.
!
! IMPORTANTE sobre bpduguard: NO se pone en los puertos de los nodos.
! Un hipervisor con bridges puede emitir trafico que lo dispare y tirar
! el puerto de un servidor en produccion.

!-----------------------------------------------------------------------------
! 5. Jumbo frames: verificacion
!-----------------------------------------------------------------------------
! El MTU tiene que ser 9000+ de PUNTA A PUNTA: NIC del nodo, puerto del
! switch y el NAS si existe. Un solo eslabon en 1500 produce fragmentacion
! y caidas intermitentes dificiles de diagnosticar.
!
! Desde un nodo Proxmox:
!     ping -M do -s 8972 10.10.91.12
! Si responde, el camino soporta 9000. Si no, revisar el eslabon que falta.

!-----------------------------------------------------------------------------
! 6. Sin storm control ni rate limit en las VLAN de cluster
!-----------------------------------------------------------------------------
! No aplicar storm-control en Gi1/0/3,7,11 ni en Gi1/0/4,8,12.
! Un limitador descartando paquetes de corosync = nodos reiniciandose.
! Si el firmware trae storm control por defecto en algun puerto, sacarlo:
!     interface range Gi1/0/3,Gi1/0/7,Gi1/0/11
!         no storm-control broadcast
!         no storm-control multicast
!         exit

!-----------------------------------------------------------------------------
! 7. Puertos para el resto de los servidores (VLAN 20)
!-----------------------------------------------------------------------------
interface range Gi1/0/13-20
    description "SERVIDORES-FISICOS"
    switchport mode access
    switchport access vlan 20
    spanning-tree portfast
    exit

! --- iDRAC / IPMI de los nodos -> VLAN 60 ---------------------------------
interface range Gi1/0/21-23
    description "IDRAC-IPMI"
    switchport mode access
    switchport access vlan 25
    spanning-tree portfast
    exit

! Los iDRAC van en VLAN 25 (administracion de los nodos) y NO en la 60: este
! switch no transporta la 60, porque su uplink lleva solo 20 y 25. Un iDRAC en
! VLAN 60 aca quedaria aislado. La politica 50 del FortiGate (ADMIN->PVE) ya
! cubre el acceso a 10.10.25.x.

!-----------------------------------------------------------------------------
! 8. Gestion del switch
!-----------------------------------------------------------------------------
interface vlan 25
    ip address 10.10.25.2 255.255.255.0
    exit

ip default-gateway 10.10.25.1

! Se usa la VLAN 25 y no la 60 para que este switch sea administrable sin
! depender de que la VLAN 60 llegue hasta el rack de servidores.

ip ssh server
ip ssh protocol 2
no ip telnet server

username "admin" password <PASSWORD> privilege 15 encrypted
enable password <PASSWORD-ENABLE>

clock timezone -3 minutes 0
sntp unicast client enable
sntp server 10.10.25.1

exit

!=============================================================================
!  GUARDAR
!=============================================================================
copy running-config startup-config

!=============================================================================
!  VERIFICACION
!=============================================================================
!   show vlan
!   show interfaces switchport Gi1/0/24
!       -> confirmar que NO aparecen las VLAN 90 ni 91
!   show vlan id 90
!       -> solo deben figurar Gi1/0/3, Gi1/0/7 y Gi1/0/11
!   show interfaces Gi1/0/4 | include MTU
!   show spanning-tree brief
!=============================================================================
