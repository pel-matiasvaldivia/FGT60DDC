#=============================================================================
#  ACCESO TEMPORAL A INTERNET POR internal4  (puerto 4)
#  FT-60F-DDC - FortiOS 7.2.6
#
#  SITUACION: WAN1 ya conectada a Telefonica y funcionando. Los switches
#  todavia no estan en internal2 ni internal3. Se necesita una salida a
#  internet provisoria enchufando un equipo (o un switch chico) al puerto 4.
#
#  RED TEMPORAL: 192.168.4.0/24 con DHCP.
#  Elegida a proposito FUERA del plan 10.10.x.x del proyecto, para que se
#  note que es provisoria y para no chocar con ninguna VLAN del diseno.
#
#  NO TOCA: internal1 (192.168.1.99), wan1, SD-WAN, ni ninguna politica
#  existente del proyecto.
#
#  *** ESTO ES TEMPORAL. La seccion 5 lo borra todo. ***
#=============================================================================


#-----------------------------------------------------------------------------
# 0. CHEQUEO PREVIO: ver si la zona SD-WAN ya existe
#-----------------------------------------------------------------------------
#   show system sdwan | grep -A3 zone
#
#   - Si aparece la zona "SDWAN"  -> usar el script tal cual esta.
#   - Si NO existe (solo aplicaste hasta WAN1, sin SD-WAN) -> en la seccion 4
#     cambiar:   set dstintf "SDWAN"     por     set dstintf "wan1"
#
#   Confirmar tambien que internal4 este libre:
#   show system interface internal4
#   get system interface physical | grep -A1 internal4


#-----------------------------------------------------------------------------
# 1. Interfaz
#-----------------------------------------------------------------------------
config system interface
    edit "internal4"
        set alias "TEMP-INTERNET"
        set mode static
        set ip 192.168.4.1 255.255.255.0
        set allowaccess ping https ssh
        set role lan
        set description "TEMPORAL - borrar cuando se conecten los switches"
    next
end

# allowaccess https/ssh: permite administrar el FortiGate desde este segmento,
# comodo mientras se trabaja en el rack. Si el puerto va a quedar accesible a
# terceros, dejar solo "ping".


#-----------------------------------------------------------------------------
# 2. DHCP
#-----------------------------------------------------------------------------
config system dhcp server
    edit 99
        set interface "internal4"
        set default-gateway 192.168.4.1
        set netmask 255.255.255.0
        set dns-service default
        set lease-time 3600
        config ip-range
            edit 1
                set start-ip 192.168.4.50
                set end-ip 192.168.4.200
            next
        end
    next
end

# lease-time 3600 (1 hora) a proposito: cuando se desarme esto, las
# direcciones caducan rapido y no quedan equipos con IP de una red que
# ya no existe.


#-----------------------------------------------------------------------------
# 3. Objeto de direccion
#-----------------------------------------------------------------------------
config firewall address
    edit "NET-TEMP-INTERNET"
        set subnet 192.168.4.0 255.255.255.0
        set comment "TEMPORAL - acceso por internal4"
    next
end


#-----------------------------------------------------------------------------
# 4. Politica de salida  +  REUBICACION  *** PASO CRITICO ***
#-----------------------------------------------------------------------------
config firewall policy
    edit 90
        set name "TEMP-INTERNET-internal4"
        set srcintf "internal4"
        set dstintf "SDWAN"
        set action accept
        set srcaddr "NET-TEMP-INTERNET"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set nat enable
        set logtraffic all
        set comments "TEMPORAL - borrar al conectar los switches"
    next
end

# FortiOS agrega las politicas nuevas AL FINAL de la lista, o sea DESPUES de
# la 999 DENY-ALL-LOG. Ahi nunca se evalua y no funciona nada.
# Hay que moverla antes del deny final:
config firewall policy
    move 90 before 999
end

# Verificar el orden resultante (90 debe aparecer ANTES que 999):
#   show firewall policy | grep -e "edit " -e "set name"


#-----------------------------------------------------------------------------
# 5. DESARME  -  ejecutar cuando se conecten los switches
#               El orden importa: primero lo que referencia, despues lo
#               referenciado, o FortiOS rechaza los borrados.
#-----------------------------------------------------------------------------
# config firewall policy
#     delete 90
# end
#
# config firewall address
#     delete "NET-TEMP-INTERNET"
