#=============================================================================
#  USO
#=============================================================================
#   Enchufar la notebook (o un switch chico sin administrar) al PUERTO 4.
#   Debe tomar una IP 192.168.4.x por DHCP y navegar.
#
#   Si no navega, revisar en este orden:
#     get system interface physical | grep -A1 internal4    <- link up?
#     execute ping 209.13.171.177                           <- gateway del ISP
