#=============================================================================
#  PLAN B  —  80 USUARIOS ANDANDO HOY, SIN LOS SWITCHES DELL
#  FT-60F-DDC · FortiOS 7.2.6
#
#  PARA QUE SIRVE
#    Los Dell N3024 estan bloqueados (config previa, sin cable de consola).
#    Este script usa los PUERTOS FISICOS del FortiGate como segmentos
#    separados, SIN etiquetas 802.1Q. Los switches quedan planos: no hay
#    nada que configurar en ellos.
#
#  RESULTADO
#    internal2  ->  USUARIOS   10.10.10.0/24   (los 3 SMC, planos)
#    internal4  ->  WIFI       10.10.30.0/24   (los 4 AP, directos)
#    internal5  ->  IOT        10.10.50.0/24   (impresoras, directo)
#    internal1  ->  Gestion    192.168.1.99    (sin cambios)
#    internal3  ->  reservado para los servidores
#
#  LO QUE SE RESIGNA HASTA RECUPERAR LOS DELL
#    - WiFi corporativo e invitados COMPARTEN segmento. Un puerto fisico no
#      puede llevar dos redes sin etiquetas. Si el aislamiento de invitados
#      es obligatorio, dejar ese SSID apagado hasta tener los Dell.
#    - Sin VLAN 60 de gestion: los SMC se administran en 10.10.10.x.
#    - Sin VLAN 25: eso llega con los servidores, por internal3.
#
#  VOLVER AL PLAN ORIGINAL despues no exige recablear los puestos: se
#  reponen las VLANs sobre internal2 y se mueve el cable del AP y de las
#  impresoras al Dell.
#
#  ANTES: execute backup config flash
#  Pegar desde internal1 (192.168.1.99). Esa sesion no se pierde.
#=============================================================================


#-----------------------------------------------------------------------------
#  1. Reapuntar las politicas a los puertos fisicos
#     Va PRIMERO: FortiOS no deja borrar una interfaz que una politica usa.
#-----------------------------------------------------------------------------
config firewall policy
    edit 10
        set srcintf "internal2"
    next
    edit 11
        set srcintf "internal4"
    next
    edit 20
        set srcintf "internal2" "internal4"
    next
    edit 50
        set srcintf "internal2" "internal"
    next
    edit 60
        set srcintf "internal2" "internal4"
        set dstintf "internal5"
    next
    edit 61
        set srcintf "internal5"
    next
end

# Las politicas de invitados pierden sentido sin VLAN 35: se borran.
config firewall policy
    delete 12
    delete 13
end

# La politica 90 (acceso temporal por internal4) se reemplaza por la 11.
config firewall policy
    delete 90
end


#-----------------------------------------------------------------------------
#  2. Borrar los DHCP de las VLANs y el temporal
#-----------------------------------------------------------------------------
config system dhcp server
    delete 10
    delete 30
    delete 35
    delete 50
    delete 99
end


#-----------------------------------------------------------------------------
#  3. Borrar las VLANs del lado del acceso
#     internal3 conserva VL20-SERVERS y VL25-PVEMGMT: no se tocan.
#-----------------------------------------------------------------------------
config system interface
    delete "VL10-USERS"
    delete "VL30-WIFICORP"
    delete "VL35-WIFIGUEST"
    delete "VL50-IOT"
    delete "VL60-MGMT"
end


#-----------------------------------------------------------------------------
#  4. Los puertos fisicos pasan a ser los segmentos
#-----------------------------------------------------------------------------
config system interface
    edit "internal2"
        set alias "USUARIOS"
        set mode static
        set ip 10.10.10.1 255.255.255.0
        set allowaccess ping https ssh
        set role lan
        set device-identification enable
        set description "PLAN B - 80 puestos via los 3 SMC planos"
    next
    edit "internal4"
        set alias "WIFI"
        set mode static
        set ip 10.10.30.1 255.255.255.0
        set allowaccess ping
        set role lan
        set device-identification enable
        set description "PLAN B - 4 AP directos"
    next
    edit "internal5"
        set alias "IOT-IMPRESORAS"
        set mode static
        set ip 10.10.50.1 255.255.255.0
        set allowaccess ping
        set role lan
        set description "PLAN B - impresoras y CCTV"
    next
end

# allowaccess https/ssh en internal2: permite administrar el FortiGate desde
# la red de usuarios mientras dure esta etapa. Quitarlo al volver al plan
# original.


#-----------------------------------------------------------------------------
#  5. DHCP sobre los puertos fisicos
#-----------------------------------------------------------------------------
config system dhcp server
    edit 10
        set interface "internal2"
        set default-gateway 10.10.10.1
        set netmask 255.255.255.0
        set dns-service specify
        set dns-server1 10.10.10.1
        set dns-server2 200.0.243.10
        set lease-time 28800
        config ip-range
            edit 1
                set start-ip 10.10.10.50
                set end-ip 10.10.10.230
            next
        end
    next
    edit 30
        set interface "internal4"
        set default-gateway 10.10.30.1
        set netmask 255.255.255.0
        set dns-service specify
        set dns-server1 10.10.30.1
        set dns-server2 200.0.243.10
        set lease-time 28800
        config ip-range
            edit 1
                set start-ip 10.10.30.50
                set end-ip 10.10.30.230
            next
        end
    next
    edit 50
        set interface "internal5"
        set default-gateway 10.10.50.1
        set netmask 255.255.255.0
        set dns-service default
        set lease-time 86400
        config ip-range
            edit 1
                set start-ip 10.10.50.100
                set end-ip 10.10.50.200
            next
        end
    next
end


#-----------------------------------------------------------------------------
#  6. Guardar
#-----------------------------------------------------------------------------
execute backup config flash


#=============================================================================
#  CABLEADO
#=============================================================================
#   FortiGate puerto 2  ->  puerto 24 de SMC-01
#   SMC-01 puerto 23    ->  puerto 24 de SMC-02
#   SMC-02 puerto 23    ->  puerto 24 de SMC-03
#       (en cascada, porque sin el Dell no hay quien concentre)
#   FortiGate puerto 4  ->  switch chico o directo a los AP
#   FortiGate puerto 5  ->  impresoras
#
#   Los SMC: RESET DE FABRICA y nada mas. Sin VLANs, sin IP si no hace falta.
#   Si les ponés IP de gestion: 10.10.10.2 / .3 / .4 con GW 10.10.10.1
#
#   Puestos: 69 en los SMC (puertos 1-22 de SMC-01 y 02, 1-23 de SMC-03)
#            mas los que entren donde haya lugar.
#
#   ATENCION: la cascada de 3 SMC pone a SMC-03 a dos saltos del firewall.
#   Es aceptable como transitorio. Con el Dell recuperado vuelve a estrella.
#=============================================================================


#=============================================================================
#  VERIFICAR
#=============================================================================
#   get system interface physical | grep -A1 internal
#   execute dhcp lease-list
#   show firewall policy | grep -e "edit " -e "set name"
#       -> la 999 DENY-ALL-LOG tiene que seguir siendo la ULTIMA
#
#   Notebook en cualquier puerto de un SMC -> 10.10.10.x y navega.
#=============================================================================


#=============================================================================
#  VOLVER AL PLAN ORIGINAL (cuando entres a los Dell)
#=============================================================================
#   1. Aplicar la seccion 5 de APLICAR-AHORA.conf (recrea las VLANs sobre
#      internal2 e internal3) y sus DHCP.
#   2. Reapuntar las politicas 10, 11, 20, 50, 60 y 61 a las VLANs.
#   3. Sacar las IP de internal4 e internal5.
#   4. Cablear el Dell al puerto 2 y los SMC al Dell.
#   Los cables de los puestos NO se tocan.
#=============================================================================
