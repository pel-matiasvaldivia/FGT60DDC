#=============================================================================
#  FortiGate 60F  -  SCRIPT DE CONFIGURACION CLI
#  Proyecto : 80 desktops + 4 AP + SAP por IPsec + Cluster Proxmox
#  FortiOS  : 7.2.6   (version del equipo del proyecto)
#  Fecha    : 2026-10
#
#  QUE ES ESTE ARCHIVO
#  -------------------
#  Es un SCRIPT CLI para pegar por consola/SSH por etapas. NO es un archivo de
#  backup/restore de FortiGate (esos llevan un header con firmware y numero de
#  serie del equipo y se suben con "Restore"; si se restaura un backup ajeno el
#  equipo lo rechaza o queda inconsistente).
#
#  COMO APLICARLO
#  --------------
#   1. En ESTE equipo la ETAPA 2 no es destructiva (ver nota en la ETAPA 2):
#      alcanza con SSH/GUI por internal1 (192.168.1.99). Tener igual el cable
#      de consola a mano por las dudas.
#   2. Reemplazar TODOS los <PLACEHOLDERS> (lista completa en ETAPA 0).
#   3. Pegar UNA ETAPA A LA VEZ y verificar antes de seguir.
#      Si una linea falla, FortiOS la saltea y sigue: revisar la salida.
#   4. Al final de cada etapa: execute backup config flash
#
#  ADVERTENCIA PREVIA
#  ------------------
#  El gateway informado 209.13.181.177 NO pertenece a la red del IP publico
#  209.13.171.178/255.255.255.248 (red 209.13.171.176/29, usables .177-.182).
#  Este script asume GW = 209.13.171.177. CONFIRMAR CON TELEFONICA.
#=============================================================================


#=============================================================================
#  ETAPA 0 - PLACEHOLDERS A REEMPLAZAR (checklist)
#=============================================================================
#  <PASS-ADMIN>          Password del usuario admin (fuerte, >14 caracteres)
#  <TZ-INDEX>            Indice de zona horaria. Obtenerlo con:
#                          config system global
#                            set timezone ?        <- lista los indices
#                          end
#                        Buscar la linea de Buenos Aires (GMT-3).
#  <KBPS-UP>/<KBPS-DOWN> Ancho de banda real de Telefonica en kbps
#                        (ej: 100 Mbps = 100000). Solo informativo para SD-WAN.
#  <IP-CLARO>            IP publica de Claro          (ETAPA 3, cuando exista)
#  <MASK-CLARO>          Mascara de Claro             (ETAPA 3)
#  <GW-CLARO>            Gateway de Claro             (ETAPA 3)
#  <IP-PEER-SAP>         IP publica del peer IPsec de SAP
#  <PSK-SAP>             Clave precompartida del tunel
#  <RED-SAP>             Red remota de SAP            (ej: 10.200.5.0)
#  <MASK-SAP>            Mascara de la red de SAP     (ej: 255.255.255.0)
#  <IP-DNS-INTERNO>      IP del DC/DNS interno. Si no hay AD todavia, usar
#                        10.10.10.1 (el propio FortiGate) y cambiarlo despues.
#=============================================================================


#=============================================================================
#  ETAPA 1 - BASE DEL SISTEMA  (segura, no corta nada)
#=============================================================================

config system global
    set hostname "FGT60F-CLIENTE"
    set alias "FGT60F-CLIENTE"
    set admin-sport 8443
    set admin-ssh-port 2222
    set admintimeout 15
    set timezone <TZ-INDEX>
    set strong-crypto enable
    set gui-certificates enable
end

# Permite usar varias interfaces de origen/destino en una misma politica.
# Sin esto, las politicas de la ETAPA 7 que listan 2 o 3 interfaces fallan.
config system settings
    set gui-multiple-interface-policy enable
    set gui-sslvpn-personal-bookmarks disable
end

config system dns
    set primary 200.0.243.10
    set secondary 200.0.243.11
end

config system ntp
    set type custom
    set ntpsync enable
    set syncinterval 60
    config ntpserver
        edit 1
            set server "ar.pool.ntp.org"
        next
        edit 2
            set server "pool.ntp.org"
        next
    end
end

# --- Administracion: password fuerte + restriccion por origen -----------------
config system admin
    edit "admin"
        set password <PASS-ADMIN>
        set trusthost1 10.10.60.0 255.255.255.0
        set trusthost2 10.10.10.0 255.255.255.0
    next
end

# --- WAN1 : Telefonica -------------------------------------------------------
config system interface
    edit "wan1"
        set alias "ISP-TELEFONICA"
        set mode static
        set ip 209.13.171.178 255.255.255.248
        set allowaccess ping
        set role wan
        set estimated-upstream-bandwidth <KBPS-UP>
        set estimated-downstream-bandwidth <KBPS-DOWN>
        set description "Telefonica - /29 - GW .177 (CONFIRMAR)"
    next
end

# --- Logging a disco (el 60F tiene disco) ------------------------------------
config log disk setting
    set status enable
    set diskfull overwrite
end

#--- VERIFICAR ETAPA 1 --------------------------------------------------------
#   get system status
#   execute ping 209.13.171.177        <- gateway del ISP
#   diagnose ip address list | grep 209.13
#   execute backup config flash
#------------------------------------------------------------------------------


#=============================================================================
#  ETAPA 2 - CREAR VLANs Y DHCP      *** NO DESTRUCTIVA EN ESTE EQUIPO ***
#=============================================================================
#
#  SITUACION DE ESTE 60F (verificada en la GUI, FortiOS 7.2.6):
#    La interfaz "internal" es de tipo VLAN Switch y tiene UN SOLO miembro:
#    internal1 (192.168.1.99/24 con DHCP .110-.210).
#    => internal2, internal3, internal4 e internal5 YA ESTAN LIBRES.
#    => NO hace falta desarmar ningun switch. NO hay corte de servicio.
#    => NO hace falta consola serie para esta etapa.
#
#  CONFIRMAR ANTES DE EJECUTAR (que ningun otro switch se lleve los puertos):
#      show system virtual-switch
#      show system switch-interface
#      get system interface physical | grep -A1 internal
#    internal2 e internal3 deben figurar como fisicos y sin pertenecer a
#    ningun switch. Si pertenecen a alguno, sacarlos primero:
#      config system virtual-switch
#          edit "<nombre-del-switch>"
#              config port
#                  delete "internal2"
#                  delete "internal3"
#              end
#          next
#      end
#    (ese delete SI corta el trafico de ese puerto: hacerlo con consola)
#
#  ASIGNACION DE PUERTOS RESULTANTE:
#      internal1  -> queda en "internal" 192.168.1.99 = PUERTO DE RESCATE
#      internal2  -> TRUNK al switch de ACCESO     (VLAN 10,30,35,50,60)
#      internal3  -> TRUNK al switch de SERVIDORES (VLAN 20,25)
#      internal4/5-> libres (crecimiento / segundo link LACP)
#
#  Mantener internal1 con la IP de fabrica durante toda la implementacion:
#  es la via de entrada si algo sale mal. Reconfigurarlo recien al final.
#=============================================================================

# --- VLANs sobre internal2 : TRUNK al switch de ACCESO -----------------------
config system interface
    edit "VL10-USERS"
        set vdom "root"
        set interface "internal2"
        set vlanid 10
        set ip 10.10.10.1 255.255.255.0
        set allowaccess ping
        set role lan
        set device-identification enable
        set description "80 desktops"
    next
    edit "VL30-WIFICORP"
        set vdom "root"
        set interface "internal2"
        set vlanid 30
        set ip 10.10.30.1 255.255.255.0
        set allowaccess ping
        set role lan
        set device-identification enable
        set description "SSID corporativo"
    next
    edit "VL35-WIFIGUEST"
        set vdom "root"
        set interface "internal2"
        set vlanid 35
        set ip 10.10.35.1 255.255.255.0
        set allowaccess ping
        set role lan
        set description "SSID invitados - solo internet"
    next
    edit "VL50-IOT"
        set vdom "root"
        set interface "internal2"
        set vlanid 50
        set ip 10.10.50.1 255.255.255.0
        set allowaccess ping
        set role lan
        set description "Impresoras / CCTV / IoT"
    next
    edit "VL60-MGMT"
        set vdom "root"
        set interface "internal2"
        set vlanid 60
        set ip 10.10.60.1 255.255.255.0
        set allowaccess ping https ssh snmp
        set role lan
        set description "Switches / AP / iDRAC / admin FGT"
    next
end

# --- VLANs sobre internal3 : TRUNK al switch de SERVIDORES -------------------
config system interface
    edit "VL20-SERVERS"
        set vdom "root"
        set interface "internal3"
        set vlanid 20
        set ip 10.10.20.1 255.255.255.0
        set allowaccess ping
        set role lan
        set description "VMs del cluster Proxmox"
    next
    edit "VL25-PVEMGMT"
        set vdom "root"
        set interface "internal3"
        set vlanid 25
        set ip 10.10.25.1 255.255.255.0
        set allowaccess ping
        set role lan
        set description "Nodos Proxmox - administracion"
    next
end

# IMPORTANTE: las VLAN 90 (corosync) y 91 (storage/migracion) NO se definen
# aca. Es intencional: viven solo en el switch de servidores, sin ruteo.
# Si algun dia aparecen en este FortiGate, el cableado esta mal.

# --- Si se usan FortiAP con CAPWAP en la VLAN de mgmt, descomentar: ---------
# config system interface
#     edit "VL60-MGMT"
#         append allowaccess capwap
#     next
# end

# --- DHCP --------------------------------------------------------------------
config system dhcp server
    edit 1
        set interface "VL10-USERS"
        set default-gateway 10.10.10.1
        set netmask 255.255.255.0
        set dns-service specify
        set dns-server1 <IP-DNS-INTERNO>
        set dns-server2 200.0.243.10
        set lease-time 28800
        set timezone-option default
        config ip-range
            edit 1
                set start-ip 10.10.10.50
                set end-ip 10.10.10.230
            next
        end
    next
    edit 2
        set interface "VL30-WIFICORP"
        set default-gateway 10.10.30.1
        set netmask 255.255.255.0
        set dns-service specify
        set dns-server1 <IP-DNS-INTERNO>
        set dns-server2 200.0.243.10
        set lease-time 28800
        config ip-range
            edit 1
                set start-ip 10.10.30.50
                set end-ip 10.10.30.230
            next
        end
    next
    edit 3
        set interface "VL35-WIFIGUEST"
        set default-gateway 10.10.35.1
        set netmask 255.255.255.0
        set dns-service default
        set lease-time 7200
        config ip-range
            edit 1
                set start-ip 10.10.35.50
                set end-ip 10.10.35.230
            next
        end
    next
    edit 4
        set interface "VL50-IOT"
        set default-gateway 10.10.50.1
        set netmask 255.255.255.0
        set dns-service default
        set lease-time 86400
        config ip-range
            edit 1
                set start-ip 10.10.50.100
                set end-ip 10.10.50.200
            next
        end
    next
end

#--- VERIFICAR ETAPA 2 --------------------------------------------------------
#   Configurar el switch: puerto al FGT internal2 = TRUNK VLANs 10,30,35,50,60
#                         puerto al FGT internal3 = TRUNK VLANs 20,25
#   Notebook en un puerto access VLAN 10 -> debe tomar IP 10.10.10.x
#   y hacer ping a 10.10.10.1
#   diagnose ip address list
#   execute backup config flash
#------------------------------------------------------------------------------


#=============================================================================
#  ETAPA 3 - SD-WAN Y RUTA POR DEFECTO
#            Hoy un solo miembro activo (wan1). wan2 queda preparado.
#=============================================================================

config system sdwan
    set status enable
    config zone
        edit "SDWAN"
        next
    end
    config members
        edit 1
            set interface "wan1"
            set zone "SDWAN"
            set gateway 209.13.171.177
            set priority 1
            set comment "Telefonica - primario"
        next
    end
    config health-check
        edit "ISP-CHECK"
            set server "200.0.243.10" "1.1.1.1" "8.8.8.8"
            set protocol ping
            set interval 1000
            set probe-timeout 1000
            set failtime 5
            set recoverytime 10
            set update-static-route enable
            set members 1
            config sla
                edit 1
                    set latency-threshold 200
                    set jitter-threshold 50
                    set packetloss-threshold 3
                next
            end
        next
    end
    config service
        edit 1
            set name "ALL-TRAFFIC"
            set mode priority
            set health-check "ISP-CHECK"
            set src "all"
            set dst "all"
            set priority-members 1
        next
    end
end

config router static
    edit 1
        set dst 0.0.0.0 0.0.0.0
        set distance 10
        set sdwan-zone "SDWAN"
        set comment "Default por zona SD-WAN"
    next
end

