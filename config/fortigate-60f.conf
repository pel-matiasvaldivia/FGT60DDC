#=============================================================================
#  ETAPA 4 - OBJETOS (direcciones, servicios, shapers, pool de NAT)
#            Deben existir ANTES de las politicas de la ETAPA 7.
#=============================================================================

config firewall address
    edit "NET-USERS"
        set subnet 10.10.10.0 255.255.255.0
        set comment "VLAN 10 - desktops"
    next
    edit "NET-SERVERS"
        set subnet 10.10.20.0 255.255.255.0
        set comment "VLAN 20 - VMs"
    next
    edit "NET-PVEMGMT"
        set subnet 10.10.25.0 255.255.255.0
        set comment "VLAN 25 - nodos Proxmox"
    next
    edit "NET-WIFICORP"
        set subnet 10.10.30.0 255.255.255.0
    next
    edit "NET-WIFIGUEST"
        set subnet 10.10.35.0 255.255.255.0
    next
    edit "NET-IOT"
        set subnet 10.10.50.0 255.255.255.0
    next
    edit "NET-MGMT"
        set subnet 10.10.60.0 255.255.255.0
    next
    edit "NET-SAP"
        set subnet <RED-SAP> <MASK-SAP>
        set comment "Red remota publicada por el proveedor SAP"
    next
end

config firewall addrgrp
    edit "GRP-LAN-INTERNA"
        set member "NET-USERS" "NET-SERVERS" "NET-PVEMGMT" "NET-WIFICORP" "NET-IOT" "NET-MGMT"
        set comment "Todo lo interno - usado en el deny de invitados"
    next
end

# --- Servicios SAP (AJUSTAR a lo que informe el proveedor) -------------------
config firewall service custom
    edit "SAP-DIAG"
        set tcp-portrange 3200-3299
        set comment "SAP GUI / dispatcher (32NN)"
    next
    edit "SAP-GW"
        set tcp-portrange 3300-3399
        set comment "SAP Gateway (33NN)"
    next
    edit "SAP-MSG"
        set tcp-portrange 3600-3699
        set comment "Message Server (36NN)"
    next
    edit "SAP-WEB"
        set tcp-portrange 8000-8099 44300-44399
        set comment "ICM HTTP/HTTPS"
    next
    edit "SAP-ICM"
        set tcp-portrange 50000-50099
        set comment "ICM / Webdispatcher rango alto"
    next
    edit "SAP-ROUTER"
        set tcp-portrange 3299
        set comment "SAProuter"
    next
    edit "PVE-WEB"
        set tcp-portrange 8006
        set comment "Proxmox VE - interfaz web"
    next
    edit "PVE-SPICE"
        set tcp-portrange 3128
        set comment "Proxmox - consola SPICE"
    next
    edit "PRINT-RAW"
        set tcp-portrange 9100-9102 515 631
        set comment "Impresion RAW / LPD / IPP"
    next
end

config firewall service group
    edit "GRP-SAP"
        set member "SAP-DIAG" "SAP-GW" "SAP-MSG" "SAP-WEB" "SAP-ICM" "SAP-ROUTER" "HTTPS" "DNS"
        set comment "ACOTAR a lo que realmente use el cliente"
    next
    edit "GRP-SERVIDORES-LAN"
        set member "SMB" "DNS" "LDAP" "KERBEROS" "HTTP" "HTTPS" "RDP" "PING" "SAP-DIAG" "SAP-GW" "SAP-MSG"
    next
    edit "GRP-PVE-ADMIN"
        set member "PVE-WEB" "PVE-SPICE" "SSH" "HTTPS" "PING"
    next
    edit "GRP-SALIDA-SERVIDORES"
        set member "DNS" "HTTP" "HTTPS" "NTP"
    next
end

# --- Shaper para invitados ---------------------------------------------------
config firewall shaper traffic-shaper
    edit "GUEST-20M"
        set maximum-bandwidth 20000
        set bandwidth-unit kbps
        set priority low
        set per-policy disable
    next
end

#--- VERIFICAR ETAPA 4: show firewall address | grep NET-  --------------------


#=============================================================================
#  ETAPA 5 - TUNEL IPsec HACIA SAP  (route-based / IKEv2)
#            Las propuestas DEBEN coincidir EXACTAMENTE con el proveedor.
#=============================================================================

config vpn ipsec phase1-interface
    edit "VPN-SAP"
        set interface "wan1"
        set ike-version 2
        set keylife 28800
        set peertype any
        set net-device disable
        set proposal aes256-sha256 aes128-sha256
        set dhgrp 14
        set remote-gw <IP-PEER-SAP>
        set psksecret <PSK-SAP>
        set dpd on-idle
        set dpd-retryinterval 30
        set comments "Tunel site-to-site hacia SAP"
    next
end

config vpn ipsec phase2-interface
    edit "VPN-SAP-P2"
        set phase1name "VPN-SAP"
        set proposal aes256-sha256 aes128-sha256
        set dhgrp 14
        set pfs enable
        set keylifeseconds 3600
        set src-subnet 10.10.20.0 255.255.255.0
        set dst-subnet <RED-SAP> <MASK-SAP>
    next
    # Repetir un phase2 por CADA par de redes local/remota que pida el proveedor.
    edit "VPN-SAP-P2-USERS"
        set phase1name "VPN-SAP"
        set proposal aes256-sha256 aes128-sha256
        set dhgrp 14
        set pfs enable
        set keylifeseconds 3600
        set src-subnet 10.10.10.0 255.255.255.0
        set dst-subnet <RED-SAP> <MASK-SAP>
    next
end

config router static
    edit 2
        set dst <RED-SAP> <MASK-SAP>
        set device "VPN-SAP"
        set distance 10
        set comment "Redes SAP por el tunel primario"
    next
end

