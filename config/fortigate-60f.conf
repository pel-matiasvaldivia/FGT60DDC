#=============================================================================
# FortiGate 60F — Script de configuracion base
# Proyecto: Cliente / 80 desktops + 4 AP + SAP por IPsec + Cluster Proxmox
# FortiOS 7.4.x  (verificar sintaxis si la version es 7.0/7.2)
#
# ANTES DE EJECUTAR:
#  - Reemplazar TODOS los placeholders <...>
#  - Confirmar gateway WAN1 (209.13.171.177, NO .181.177)
#  - execute backup config flash pre-cambios
#  - Aplicar por CONSOLA SERIE: el bloque 1 corta la conectividad LAN
#=============================================================================

#-----------------------------------------------------------------------------
# 1. Liberar puertos del hardware switch "internal" para usarlos como trunk
#    Verificar nombres previamente:  show system virtual-switch
#-----------------------------------------------------------------------------
config system virtual-switch
    edit "internal"
        config port
            delete "internal1"
            delete "internal2"
        end
    next
end

#-----------------------------------------------------------------------------
# 2. Hostname, DNS, NTP, admin
#-----------------------------------------------------------------------------
config system global
    set hostname "FGT60F-CLIENTE"
    set admin-sport 8443
    set admintimeout 15
    set timezone 60                      # America/Buenos_Aires (verificar con: show full | grep timezone)
    set gui-theme "mariner"
    set strong-crypto enable
end

config system dns
    set primary 200.0.243.10
    set secondary 200.0.243.11
end

config system ntp
    set type custom
    set ntpsync enable
    config ntpserver
        edit 1
            set server "ar.pool.ntp.org"
        next
    end
end

config system admin
    edit "admin"
        set trusthost1 10.10.60.0 255.255.255.0
        set trusthost2 10.10.10.0 255.255.255.0
        set password <PASSWORD-FUERTE>
    next
end

#-----------------------------------------------------------------------------
# 3. Interfaces WAN
#-----------------------------------------------------------------------------
config system interface
    edit "wan1"
        set alias "ISP-TELEFONICA"
        set mode static
        set ip 209.13.171.178 255.255.255.248
        set allowaccess ping
        set role wan
        set estimated-upstream-bandwidth <KBPS-UP>
        set estimated-downstream-bandwidth <KBPS-DOWN>
    next
    edit "wan2"
        set alias "ISP-CLARO-PENDIENTE"
        set status down                  # habilitar cuando Claro este activo
        set mode static
        set ip <IP-CLARO> <MASK-CLARO>
        set allowaccess ping
        set role wan
    next
end

#-----------------------------------------------------------------------------
# 4. VLANs (puerto 1 = trunk a SW-CORE, puerto 2 = trunk a SW-SERVIDORES)
#-----------------------------------------------------------------------------
config system interface
    edit "VL10-USERS"
        set vdom "root"
        set interface "internal1"
        set vlanid 10
        set ip 10.10.10.1 255.255.255.0
        set allowaccess ping
        set role lan
        set device-identification enable
        set description "80 desktops"
    next
    edit "VL30-WIFICORP"
        set vdom "root"
        set interface "internal1"
        set vlanid 30
        set ip 10.10.30.1 255.255.255.0
        set allowaccess ping
        set role lan
        set device-identification enable
    next
    edit "VL35-WIFIGUEST"
        set vdom "root"
        set interface "internal1"
        set vlanid 35
        set ip 10.10.35.1 255.255.255.0
        set allowaccess ping
        set role lan
    next
    edit "VL50-IOT"
        set vdom "root"
        set interface "internal1"
        set vlanid 50
        set ip 10.10.50.1 255.255.255.0
        set allowaccess ping
        set role lan
    next
    edit "VL60-MGMT"
        set vdom "root"
        set interface "internal1"
        set vlanid 60
        set ip 10.10.60.1 255.255.255.0
        set allowaccess ping https ssh snmp capwap
        set role lan
    next
    edit "VL20-SERVERS"
        set vdom "root"
        set interface "internal2"
        set vlanid 20
        set ip 10.10.20.1 255.255.255.0
        set allowaccess ping
        set role lan
        set description "VMs del cluster Proxmox"
    next
    edit "VL25-PVEMGMT"
        set vdom "root"
        set interface "internal2"
        set vlanid 25
        set ip 10.10.25.1 255.255.255.0
        set allowaccess ping
        set role lan
        set description "Nodos Proxmox - interfaz de administracion"
    next
end
# NOTA: VLAN 90 (corosync) y 91 (storage/migracion) NO se definen en el FortiGate.
#       Existen solo en el switch de servidores, sin ruteo. Es intencional.

#-----------------------------------------------------------------------------
# 5. DHCP (usuarios y wifi; servidores y mgmt con IP fija)
#-----------------------------------------------------------------------------
config system dhcp server
    edit 1
        set interface "VL10-USERS"
        set default-gateway 10.10.10.1
        set netmask 255.255.255.0
        set dns-service specify
        set dns-server1 10.10.20.10          # DNS interno (AD). Si no hay AD: 10.10.10.1
        set dns-server2 200.0.243.10
        set lease-time 28800
        config ip-range
            edit 1
                set start-ip 10.10.10.50
                set end-ip 10.10.10.230
            next
        end
    next
    edit 2
        set interface "VL30-WIFICORP"
        set default-gateway 10.10.30.1
        set netmask 255.255.255.0
        set dns-service specify
        set dns-server1 10.10.20.10
        set dns-server2 200.0.243.10
        config ip-range
            edit 1
                set start-ip 10.10.30.50
                set end-ip 10.10.30.230
            next
        end
    next
    edit 3
        set interface "VL35-WIFIGUEST"
        set default-gateway 10.10.35.1
        set netmask 255.255.255.0
        set dns-service default
        set lease-time 7200
        config ip-range
            edit 1
                set start-ip 10.10.35.50
                set end-ip 10.10.35.230
            next
        end
    next
end

#-----------------------------------------------------------------------------
# 6. SD-WAN (hoy solo wan1; wan2 queda listo)
#-----------------------------------------------------------------------------
config system sdwan
    set status enable
    config zone
        edit "SDWAN"
        next
    end
    config members
        edit 1
            set interface "wan1"
            set zone "SDWAN"
            set gateway 209.13.171.177
            set priority 1
        next
        edit 2
            set interface "wan2"
            set zone "SDWAN"
            set gateway <GW-CLARO>
            set priority 10
            set status disable               # habilitar al activar Claro
        next
    end
    config health-check
        edit "ISP-CHECK"
            set server "200.0.243.10" "1.1.1.1" "8.8.8.8"
            set protocol ping
            set interval 1000
            set failtime 5
            set recoverytime 10
            set members 1 2
            config sla
                edit 1
                    set latency-threshold 200
                    set jitter-threshold 50
                    set packetloss-threshold 3
                next
            end
        next
    end
    config service
        edit 1
            set name "ALL-TRAFFIC"
            set mode priority
            set health-check "ISP-CHECK"
            set src "all"
            set dst "all"
            set priority-members 1 2
        next
    end
end

config router static
    edit 1
        set distance 10
        set sdwan-zone "SDWAN"
    next
end

#-----------------------------------------------------------------------------
# 7. IPsec site-to-site hacia SAP (route-based / IKEv2)
#    Completar con los datos del proveedor SAP. Las propuestas DEBEN coincidir.
#-----------------------------------------------------------------------------
config vpn ipsec phase1-interface
    edit "VPN-SAP"
        set interface "wan1"
        set ike-version 2
        set keylife 28800
        set peertype any
        set net-device disable
        set proposal aes256-sha256 aes128-sha256
        set dhgrp 14
        set remote-gw <IP-PUBLICA-PEER-SAP>
        set psksecret <PSK-COMPARTIDA>
        set dpd on-idle
        set dpd-retryinterval 30
    next
end

config vpn ipsec phase2-interface
    edit "VPN-SAP-P2"
        set phase1name "VPN-SAP"
        set proposal aes256-sha256 aes128-sha256
        set dhgrp 14
        set pfs enable
        set keylifeseconds 3600
        set src-subnet 10.10.20.0 255.255.255.0      # repetir el bloque por cada par de redes
        set dst-subnet <RED-SAP> <MASK-SAP>
    next
end

config firewall address
    edit "NET-SAP"
        set subnet <RED-SAP> <MASK-SAP>
    next
    edit "NET-USERS"
        set subnet 10.10.10.0 255.255.255.0
    next
    edit "NET-SERVERS"
        set subnet 10.10.20.0 255.255.255.0
    next
    edit "NET-PVEMGMT"
        set subnet 10.10.25.0 255.255.255.0
    next
    edit "NET-WIFICORP"
        set subnet 10.10.30.0 255.255.255.0
    next
    edit "NET-WIFIGUEST"
        set subnet 10.10.35.0 255.255.255.0
    next
    edit "NET-IOT"
        set subnet 10.10.50.0 255.255.255.0
    next
    edit "NET-MGMT"
        set subnet 10.10.60.0 255.255.255.0
    next
end

config firewall addrgrp
    edit "GRP-RFC1918"
        set member "NET-USERS" "NET-SERVERS" "NET-PVEMGMT" "NET-WIFICORP" "NET-IOT" "NET-MGMT"
    next
end

config router static
    edit 2
        set dst <RED-SAP> <MASK-SAP>
        set device "VPN-SAP"
        set distance 10
        set comment "Redes SAP por tunel primario"
    next
end

# Servicios SAP (ajustar segun lo que informe el proveedor)
config firewall service custom
    edit "SAP-DIAG"
        set tcp-portrange 3200-3299
    next
    edit "SAP-GW"
        set tcp-portrange 3300-3399
    next
    edit "SAP-MSG"
        set tcp-portrange 3600-3699
    next
    edit "SAP-WEB"
        set tcp-portrange 8000-8099:0-65535 44300-44399
    next
    edit "SAP-HTTPS-ICM"
        set tcp-portrange 50000-50099
    next
end

#-----------------------------------------------------------------------------
# 8. Perfiles de seguridad (requieren licencia UTP/ATP activa)
#-----------------------------------------------------------------------------
config firewall ssl-ssh-profile
    edit "cert-insp"
        set comment "Inspeccion por certificado (sin romper SSL). Deep inspection en etapa 2."
    next
end

#-----------------------------------------------------------------------------
# 9. Politicas de firewall  (el orden importa)
#-----------------------------------------------------------------------------
config firewall policy

    # --- 9.1 Usuarios -> Internet
    edit 10
        set name "USERS->INTERNET"
        set srcintf "VL10-USERS"
        set dstintf "SDWAN"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat enable
        set utm-status enable
        set av-profile "default"
        set ips-sensor "default"
        set webfilter-profile "default"
        set application-list "default"
        set dnsfilter-profile "default"
        set ssl-ssh-profile "certificate-inspection"
        set logtraffic all
    next

    # --- 9.2 Wifi corporativo -> Internet
    edit 11
        set name "WIFICORP->INTERNET"
        set srcintf "VL30-WIFICORP"
        set dstintf "SDWAN"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat enable
        set utm-status enable
        set av-profile "default"
        set ips-sensor "default"
        set webfilter-profile "default"
        set application-list "default"
        set ssl-ssh-profile "certificate-inspection"
        set logtraffic all
    next

    # --- 9.3 Invitados: SOLO internet. Primero el deny hacia lo interno.
    edit 12
        set name "GUEST-DENY-INTERNO"
        set srcintf "VL35-WIFIGUEST"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "GRP-RFC1918"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 13
        set name "GUEST->INTERNET"
        set srcintf "VL35-WIFIGUEST"
        set dstintf "SDWAN"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "DNS" "HTTP" "HTTPS"
        set nat enable
        set utm-status enable
        set webfilter-profile "default"
        set application-list "default"
        set ssl-ssh-profile "certificate-inspection"
        set traffic-shaper "guest-20M"
        set traffic-shaper-reverse "guest-20M"
        set logtraffic all
    next

    # --- 9.4 Usuarios/Wifi -> Servidores internos
    edit 20
        set name "USERS->SERVERS"
        set srcintf "VL10-USERS" "VL30-WIFICORP"
        set dstintf "VL20-SERVERS"
        set srcaddr "all"
        set dstaddr "NET-SERVERS"
        set action accept
        set schedule "always"
        set service "SMB" "DNS" "LDAP" "KERBEROS" "HTTP" "HTTPS" "RDP" "SAP-DIAG" "SAP-GW" "SAP-MSG"
        set utm-status enable
        set ips-sensor "default"
        set logtraffic all
    next

    # --- 9.5 Usuarios y servidores -> SAP por el tunel
    edit 30
        set name "LAN->SAP-IPSEC"
        set srcintf "VL10-USERS" "VL30-WIFICORP" "VL20-SERVERS"
        set dstintf "VPN-SAP"
        set srcaddr "NET-USERS" "NET-WIFICORP" "NET-SERVERS"
        set dstaddr "NET-SAP"
        set action accept
        set schedule "always"
        set service "SAP-DIAG" "SAP-GW" "SAP-MSG" "SAP-WEB" "SAP-HTTPS-ICM" "HTTPS" "DNS"
        set utm-status enable
        set ips-sensor "default"
        set logtraffic all
        set comment "Ajustar servicios a lo que publique el proveedor SAP"
    next
    edit 31
        set name "SAP-IPSEC->LAN"
        set srcintf "VPN-SAP"
        set dstintf "VL20-SERVERS"
        set srcaddr "NET-SAP"
        set dstaddr "NET-SERVERS"
        set action accept
        set schedule "always"
        set service "ALL"                    # ACOTAR: dejar solo lo que SAP deba iniciar
        set utm-status enable
        set ips-sensor "default"
        set logtraffic all
    next

    # --- 9.6 Servidores -> Internet (updates, licencias). Acotar con FQDN si se puede.
    edit 40
        set name "SERVERS->INTERNET"
        set srcintf "VL20-SERVERS" "VL25-PVEMGMT"
        set dstintf "SDWAN"
        set srcaddr "NET-SERVERS" "NET-PVEMGMT"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "DNS" "HTTP" "HTTPS" "NTP"
        set nat enable
        set utm-status enable
        set av-profile "default"
        set ips-sensor "default"
        set ssl-ssh-profile "certificate-inspection"
        set logtraffic all
    next

    # --- 9.7 Administracion del cluster Proxmox desde la red de soporte
    edit 50
        set name "MGMT->PVE"
        set srcintf "VL60-MGMT" "VL10-USERS"
        set dstintf "VL25-PVEMGMT"
        set srcaddr "NET-MGMT" "NET-USERS"
        set dstaddr "NET-PVEMGMT"
        set action accept
        set schedule "always"
        set service "HTTPS" "SSH" "PING"
        set logtraffic all
        set comment "Puerto 8006 incluido via servicio custom PVE-WEB si hace falta"
    next

    # --- 9.8 Impresoras / IoT: hacia la LAN si corresponde, nunca a internet
    edit 60
        set name "USERS->IOT"
        set srcintf "VL10-USERS" "VL30-WIFICORP"
        set dstintf "VL50-IOT"
        set srcaddr "all"
        set dstaddr "NET-IOT"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS" "PING" "SMB"
        set logtraffic all
    next
    edit 61
        set name "IOT-DENY-INTERNET"
        set srcintf "VL50-IOT"
        set dstintf "SDWAN"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next

    # --- 9.9 Deny explicito final con log (buena practica de auditoria)
    edit 999
        set name "DENY-ALL-LOG"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end

#-----------------------------------------------------------------------------
# 10. Shaper para invitados
#-----------------------------------------------------------------------------
config firewall shaper traffic-shaper
    edit "guest-20M"
        set maximum-bandwidth 20000
        set bandwidth-unit kbps
        set priority low
    next
end

#-----------------------------------------------------------------------------
# 11. Servicio custom para la GUI de Proxmox
#-----------------------------------------------------------------------------
config firewall service custom
    edit "PVE-WEB"
        set tcp-portrange 8006
    next
    edit "PVE-SPICE"
        set tcp-portrange 3128
    next
end

#=============================================================================
