#=============================================================================
#  ETAPA 6 - PERFILES DE SEGURIDAD
#            Requieren licencia UTP/ATP activa y el equipo registrado.
#            Se usan los perfiles "default" de fabrica + certificate-inspection.
#            NO activar deep-inspection todavia (etapa 2 del proyecto:
#            requiere distribuir el certificado del FGT por GPO y excluir
#            SAP, homebanking y AFIP para no romper el pinning).
#=============================================================================

# Verificar que existan antes de la ETAPA 7:
#   show firewall ssl-ssh-profile | grep edit
#   show antivirus profile | grep edit
#   show ips sensor | grep edit
#   show webfilter profile | grep edit
#   show application list | grep edit
#   show dnsfilter profile | grep edit
#
# Si el equipo no tiene licencia, QUITAR de las politicas de la ETAPA 7 las
# lineas av-profile / ips-sensor / webfilter-profile / application-list /
# dnsfilter-profile y dejar solo el ruteo. Las politicas funcionan igual.


#=============================================================================
#  ETAPA 7 - POLITICAS DE FIREWALL
#            EL ORDEN IMPORTA: se evaluan de arriba hacia abajo.
#=============================================================================

config firewall policy

    # ---- 10 : Usuarios -> Internet -------------------------------------------
    edit 10
        set name "USERS->INTERNET"
        set srcintf "VL10-USERS"
        set dstintf "SDWAN"
        set action accept
        set srcaddr "NET-USERS"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set nat enable
        set utm-status enable
        set av-profile "default"
        set ips-sensor "default"
        set webfilter-profile "default"
        set application-list "default"
        set dnsfilter-profile "default"
        set ssl-ssh-profile "certificate-inspection"
        set logtraffic all
    next

    # ---- 11 : WiFi corporativo -> Internet -----------------------------------
    edit 11
        set name "WIFICORP->INTERNET"
        set srcintf "VL30-WIFICORP"
        set dstintf "SDWAN"
        set action accept
        set srcaddr "NET-WIFICORP"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set nat enable
        set utm-status enable
        set av-profile "default"
        set ips-sensor "default"
        set webfilter-profile "default"
        set application-list "default"
        set dnsfilter-profile "default"
        set ssl-ssh-profile "certificate-inspection"
        set logtraffic all
    next

    # ---- 12 : Invitados NO pueden ver la red interna -------------------------
    #      Va ANTES del permit a internet. Si se invierte, no sirve.
    edit 12
        set name "GUEST-DENY-LAN"
        set srcintf "VL35-WIFIGUEST"
        set dstintf "any"
        set action deny
        set srcaddr "NET-WIFIGUEST"
        set dstaddr "GRP-LAN-INTERNA"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next

    # ---- 13 : Invitados -> solo internet -------------------------------------
    edit 13
        set name "GUEST->INTERNET"
        set srcintf "VL35-WIFIGUEST"
        set dstintf "SDWAN"
        set action accept
        set srcaddr "NET-WIFIGUEST"
        set dstaddr "all"
        set schedule "always"
        set service "DNS" "HTTP" "HTTPS"
        set nat enable
        set utm-status enable
        set webfilter-profile "default"
        set application-list "default"
        set ssl-ssh-profile "certificate-inspection"
        set traffic-shaper "GUEST-20M"
        set traffic-shaper-reverse "GUEST-20M"
        set logtraffic all
    next

    # ---- 20 : Usuarios y WiFi corp -> Servidores internos --------------------
    edit 20
        set name "USERS->SERVERS"
        set srcintf "VL10-USERS" "VL30-WIFICORP"
        set dstintf "VL20-SERVERS"
        set action accept
        set srcaddr "NET-USERS" "NET-WIFICORP"
        set dstaddr "NET-SERVERS"
        set schedule "always"
        set service "GRP-SERVIDORES-LAN"
        set utm-status enable
        set ips-sensor "default"
        set logtraffic all
    next

    # ---- 30 : LAN -> SAP por el tunel ---------------------------------------
    edit 30
        set name "LAN->SAP-IPSEC"
        set srcintf "VL10-USERS" "VL30-WIFICORP" "VL20-SERVERS"
        set dstintf "VPN-SAP"
        set action accept
        set srcaddr "NET-USERS" "NET-WIFICORP" "NET-SERVERS"
        set dstaddr "NET-SAP"
        set schedule "always"
        set service "GRP-SAP"
        set utm-status enable
        set ips-sensor "default"
        set logtraffic all
        set comments "Ajustar GRP-SAP a lo que publique el proveedor"
    next

    # ---- 31 : SAP -> LAN (ACOTAR o eliminar) --------------------------------
    #      Arranca solo con PING para probar el tunel. Abrir despues SOLO los
    #      puertos que SAP realmente necesite INICIAR hacia la LAN del cliente.
    edit 31
        set name "SAP-IPSEC->SERVERS"
        set srcintf "VPN-SAP"
        set dstintf "VL20-SERVERS"
        set action accept
        set srcaddr "NET-SAP"
        set dstaddr "NET-SERVERS"
        set schedule "always"
        set service "PING"
        set utm-status enable
        set ips-sensor "default"
        set logtraffic all
        set comments "Abrir servicios de a uno, nunca ALL"
    next

    # ---- 40 : Servidores y nodos PVE -> Internet (updates/licencias) --------
    edit 40
        set name "SERVERS->INTERNET"
        set srcintf "VL20-SERVERS" "VL25-PVEMGMT"
        set dstintf "SDWAN"
        set action accept
        set srcaddr "NET-SERVERS" "NET-PVEMGMT"
        set dstaddr "all"
        set schedule "always"
        set service "GRP-SALIDA-SERVIDORES"
        set nat enable
        set utm-status enable
        set av-profile "default"
        set ips-sensor "default"
        set ssl-ssh-profile "certificate-inspection"
        set logtraffic all
        set comments "Sin navegacion libre - solo DNS/HTTP/HTTPS/NTP"
    next

    # ---- 50 : Administracion del cluster Proxmox ----------------------------
    edit 50
        set name "ADMIN->PVE"
        set srcintf "VL60-MGMT" "VL10-USERS"
        set dstintf "VL25-PVEMGMT"
        set action accept
        set srcaddr "NET-MGMT" "NET-USERS"
        set dstaddr "NET-PVEMGMT"
        set schedule "always"
        set service "GRP-PVE-ADMIN"
        set logtraffic all
        set comments "Restringir NET-USERS a un grupo de IPs de soporte"
    next

    # ---- 60 : Usuarios -> Impresoras / IoT ----------------------------------
    edit 60
        set name "USERS->IOT"
        set srcintf "VL10-USERS" "VL30-WIFICORP"
        set dstintf "VL50-IOT"
        set action accept
        set srcaddr "NET-USERS" "NET-WIFICORP"
        set dstaddr "NET-IOT"
        set schedule "always"
        set service "HTTP" "HTTPS" "PING" "SMB" "PRINT-RAW"
        set logtraffic all
    next

    # ---- 61 : IoT / impresoras NO salen a internet --------------------------
    edit 61
        set name "IOT-DENY-INTERNET"
        set srcintf "VL50-IOT"
        set dstintf "SDWAN"
        set action deny
        set srcaddr "NET-IOT"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next

    # ---- 999 : Deny final con log (auditoria) -------------------------------
    #      No cambia el comportamiento (ya hay deny implicito) pero deja
    #      rastro de todo lo bloqueado. Es lo que vas a mirar cuando algo
    #      "no funcione".
    edit 999
        set name "DENY-ALL-LOG"
        set srcintf "any"
        set dstintf "any"
        set action deny
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end

