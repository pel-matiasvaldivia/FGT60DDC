#=============================================================================
#  FIX 2 — borrar y recrear las politicas del proyecto
#  FT-60F-DDC · FortiOS 7.2.14
#
#  DIAGNOSTICO CONFIRMADO
#    Las politicas 5,10,11,12,13,20,40,50,60,61 existen en el CLI pero NO
#    aparecen en la GUI: estan malformadas, sin srcaddr. Una politica asi no
#    matchea nada. El contador de DENY-ALL-LOG (411 kB) prueba que el trafico
#    llega bien al FortiGate y muere en el deny final.
#    Parchear srcaddr sobre ellas ya se intento y no tomo. Se recrean.
#
#  ESTRATEGIA
#    Se crean SIN perfiles de seguridad. Primero que navegue; el UTM se
#    agrega despues (seccion 4), una vez confirmada la licencia. Asi, si algo
#    falla, se sabe que no es el UTM.
#
#  PEGAR DE A UN BLOQUE y mirar la salida de cada uno.
#  ANTES: execute backup config flash
#=============================================================================


#=============================================================================
#  BLOQUE 1 — borrar las rotas y el deny final
#  El deny se borra para que las nuevas no queden despues de el.
#=============================================================================
config firewall policy
    delete 999
    delete 5
    delete 10
    delete 11
    delete 12
    delete 13
    delete 20
    delete 40
    delete 50
    delete 60
    delete 61
end

# Verificar que solo quede la 90:
#   show firewall policy | grep -f name


#=============================================================================
#  BLOQUE 2 — CREAR LOS OBJETOS DE DIRECCION
#  Verificado en el equipo: NO EXISTEN. Es la causa raiz de todo: sin ellos
#  "set srcaddr NET-USERS" devuelve "entry not found in datasource" y la
#  politica queda sin origen.
#=============================================================================
config firewall address
    edit "NET-USERS"
        set subnet 10.10.10.0 255.255.255.0
    next
    edit "NET-SERVERS"
        set subnet 10.10.20.0 255.255.255.0
    next
    edit "NET-PVEMGMT"
        set subnet 10.10.25.0 255.255.255.0
    next
    edit "NET-WIFICORP"
        set subnet 10.10.30.0 255.255.255.0
    next
    edit "NET-WIFIGUEST"
        set subnet 10.10.35.0 255.255.255.0
    next
    edit "NET-IOT"
        set subnet 10.10.50.0 255.255.255.0
    next
    edit "NET-MGMT-VL60"
        set subnet 10.10.60.0 255.255.255.0
    next
    edit "NET-MGMT-LEGACY"
        set subnet 192.168.1.0 255.255.255.0
    next
end

config firewall addrgrp
    edit "GRP-LAN-INTERNA"
        set member "NET-USERS" "NET-SERVERS" "NET-PVEMGMT" "NET-WIFICORP" "NET-IOT" "NET-MGMT-VL60" "NET-MGMT-LEGACY"
    next
end

# Comprobar que entraron antes de seguir:
show firewall address NET-USERS
show firewall address NET-WIFICORP
show firewall address NET-IOT
show firewall address NET-SERVERS
show firewall address NET-PVEMGMT
show firewall address NET-MGMT-VL60
show firewall address NET-MGMT-LEGACY
show firewall address NET-WIFIGUEST
show firewall addrgrp GRP-LAN-INTERNA

# Si alguno NO aparece, crearlo antes de continuar:
#   config firewall address
#       edit "NET-USERS"
#           set subnet 10.10.10.0 255.255.255.0
#       next
#   end


#=============================================================================
#  BLOQUE 3 — recrear las politicas, UNA POR UNA
#  Cada una en su propio config/end: si una falla, no arrastra a las demas.
#=============================================================================

config firewall policy
    edit 10
        set name "USERS->INTERNET"
        set srcintf "VL10-USERS"
        set dstintf "SDWAN"
        set srcaddr "NET-USERS"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat enable
        set logtraffic all
    next
end

config firewall policy
    edit 11
        set name "WIFICORP->INTERNET"
        set srcintf "VL30-WIFICORP"
        set dstintf "SDWAN"
        set srcaddr "NET-WIFICORP"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat enable
        set logtraffic all
    next
end

