#=============================================================================
#  FT-60F-DDC  -  PUESTA A PUNTO COMPLETA  (equipo nuevo, sin servicio)
#  FortiOS 7.2.6 build1575
#  Proyecto: 80 desktops + 4 AP + SAP por IPsec + Cluster Proxmox
#
#  CONTEXTO: el equipo esta recien sacado de la caja, no presta ningun
#  servicio y no hay nada conectado salvo el puesto de configuracion.
#  Por eso este script LIMPIA primero las redes de prueba de fabrica y
#  despues deja el layout definitivo, listo para cablear.
#
#  LO UNICO QUE SE PRESERVA INTACTO:
#      interfaz "internal" (hard-switch) 192.168.1.99/24 con HTTPS+SSH
#      su miembro internal1  ("eth1")  +  el DHCP server 1
#  Es el puerto por el que estas conectado AHORA y el de rescate despues.
#  Ningun comando de este script lo toca.
#
#  LAYOUT FINAL DE PUERTOS
#  -----------------------
#      internal1  -> gestion / rescate       192.168.1.99/24  (sin cambios)
#      internal2  -> TRUNK switch de ACCESO      VLAN 10,30,35,50,60
#      internal3  -> TRUNK switch de SERVIDORES  VLAN 20,25
#      internal4  -> libre (crecimiento / 2do link LACP)
#      internal5  -> libre (crecimiento / 2do link LACP)
#      dmz        -> libre, sin IP (publicar servicios a futuro)
#      a + b      -> fortilink 10.255.1.1/24 (FortiAP / FortiSwitch)
#      wan1       -> Telefonica  209.13.171.178/29
#      wan2       -> Claro (pendiente de alta)
#
#  ANTES DE EMPEZAR
#  ----------------
#   1. Actualizar firmware a la ultima mature de la rama 7.2 (o pasar a 7.4
#      si se decide; en ese caso revisar el script, hay comandos que cambian).
#   2. Registrar en FortiCare y activar la licencia UTP/ATP.
#      OJO: hace falta internet. Si todavia no esta WAN1, dejar la licencia
#      para despues de conectar y ANTES de probar los perfiles de seguridad.
#   3. execute backup config flash
#   4. Reemplazar los <PLACEHOLDERS> de la ETAPA 0.
#   5. Pegar etapa por etapa y verificar.
#=============================================================================


#=============================================================================
#  ETAPA 0 - PLACEHOLDERS
#=============================================================================
#  <PASS-ADMIN>      Password del admin (>14 caracteres, no reutilizado)
#  <TZ-INDEX>        Indice de zona horaria. Obtenerlo en el equipo con:
#                      config system global
#                        set timezone ?
#                      end
#                    En 7.2 el valor es NUMERICO. Hoy esta en 04.
#  <KBPS-UP>         Subida contratada a Telefonica, en kbps (100M = 100000)
#  <KBPS-DOWN>       Bajada contratada, en kbps
#  <IP-DNS-INTERNO>  DNS interno (AD). Si todavia no existe: 10.10.10.1
#  <IP-PEER-SAP>     IP publica del peer IPsec de SAP
#  <PSK-SAP>         Clave precompartida del tunel
#  <RED-SAP>         Red remota de SAP        (ej 10.200.5.0)
#  <MASK-SAP>        Mascara de SAP           (ej 255.255.255.0)
#
#  Datos de Claro (<IP-CLARO> <MASK-CLARO> <GW-CLARO>): recien en la ETAPA 4,
#  bloque comentado, cuando se active el servicio.
#=============================================================================


#=============================================================================
#  ETAPA 1 - LIMPIEZA DE LAS REDES DE PRUEBA
#            Seguro: ninguna de estas redes tiene nada conectado.
#            NO se toca "internal" ni el DHCP 1.
#=============================================================================

# --- Politica de fabrica (internal -> wan1). Se recrea en la ETAPA 4
#     apuntando a la zona SD-WAN. Hay que borrarla antes porque referencia
#     wan1 directamente y eso impide meter wan1 en SD-WAN.
config firewall policy
    delete 1
end

# --- DHCP de las redes de prueba (3 = LAN-ETH, 4 = LAN-WIFI)
#     Se borran ANTES que las interfaces: si no, FortiOS rechaza el borrado.
config system dhcp server
    delete 3
    delete 4
end

# --- VLAN 100 "LAN-ETH" (172.16.0.1/24) sobre internal2: se elimina para
#     dejar el puerto limpio como trunk del proyecto.
config system interface
    delete "LAN"
end

# --- internal3: tenia IP directa 10.10.1.1/24 "LAN-WIFI". Se libera.
config system interface
    edit "internal3"
        unset ip
        unset alias
        unset device-identification
        unset role
    next
end

# --- dmz: tenia 10.10.10.1/24, que choca con la VLAN 10 del proyecto.
#     Confirmado por el cliente: no hay nada conectado. Se libera.
config system interface
    edit "dmz"
        unset ip
        set alias "DMZ-LIBRE"
        set description "Reservado para publicar servicios"
    next
end

#--- VERIFICAR ETAPA 1 --------------------------------------------------------
#   show system interface | grep -e "edit " -e "set ip "
#   show system dhcp server | grep -e "edit " -e "interface"
#   show firewall policy
#   Debe quedar: internal con 192.168.1.99, DHCP 1 y 2, sin politicas.
#------------------------------------------------------------------------------


#=============================================================================
#  ETAPA 2 - SISTEMA
#=============================================================================

config system global
    set hostname "FT-60F-DDC"
    set alias "FT-60F-DDC"
    set admintimeout 15
    set timezone <TZ-INDEX>
    set strong-crypto enable
end

# Necesario para las politicas que listan varias interfaces de origen (ETAPA 8)
config system settings
    set gui-multiple-interface-policy enable
end

# --- DNS: venia en FortiGuard con DNS-over-TLS. Se pasa a los de Telefonica.
#     Si no se saca el modo DoT, el ISP no responde y queda sin resolucion.
config system dns
    set protocol cleartext
    unset server-hostname
    set primary 200.0.243.10
    set secondary 200.0.243.11
end

config system ntp
    set type custom
    set ntpsync enable
    set syncinterval 60
    config ntpserver
        edit 1
            set server "ar.pool.ntp.org"
        next
        edit 2
            set server "pool.ntp.org"
        next
    end
end

# --- Password del admin. Los trusthost van al final (ETAPA 9): aplicarlos
#     ahora, antes de que existan las VLANs, es la via mas rapida a un bloqueo.
config system admin
    edit "admin"
        set password <PASS-ADMIN>
    next
end

config log disk setting
    set status enable
    set diskfull overwrite
end


#=============================================================================
#  ETAPA 3 - WAN1 : TELEFONICA
#=============================================================================
#  GW 209.13.171.177 - CONFIRMAR CON TELEFONICA ANTES DEL ALTA.
#  El dato informado (209.13.181.177) no pertenece a la red 209.13.171.176/29.
#  Red: 209.13.171.176/29 - usables .177 a .182 - broadcast .183

config system interface
    edit "wan1"
        set alias "ISP-TELEFONICA"
        set mode static
        set ip 209.13.171.178 255.255.255.248
        set allowaccess ping
        set role wan
        set estimated-upstream-bandwidth <KBPS-UP>
        set estimated-downstream-bandwidth <KBPS-DOWN>
        set description "Telefonica /29"
    next
end

# wan2 queda en DHCP y sin uso hasta que Claro este activo.

#--- Mientras el cable de Telefonica NO este conectado, wan1 queda DOWN y
#    el equipo no tiene internet. Es lo esperado. Al conectar:
#      execute ping 209.13.171.177
#      execute ping 8.8.8.8
#------------------------------------------------------------------------------


#=============================================================================
#  ETAPA 4 - SD-WAN Y SALIDA A INTERNET
#=============================================================================

config system sdwan
    set status enable
    config zone
        edit "SDWAN"
        next
    end
    config members
        edit 1
            set interface "wan1"
            set zone "SDWAN"
            set gateway 209.13.171.177
            set priority 1
            set comment "Telefonica - primario"
        next
    end
    config health-check
        edit "ISP-CHECK"
            set server "200.0.243.10" "1.1.1.1" "8.8.8.8"
            set protocol ping
            set interval 1000
            set probe-timeout 1000
            set failtime 5
            set recoverytime 10
            set update-static-route enable
            set members 1
            config sla
                edit 1
                    set latency-threshold 200
                    set jitter-threshold 50
                    set packetloss-threshold 3
                next
            end
        next
    end
    config service
        edit 1
            set name "ALL-TRAFFIC"
            set mode priority
            set health-check "ISP-CHECK"
            set src "all"
            set dst "all"
            set priority-members 1
        next
    end
end

config router static
    edit 1
        set dst 0.0.0.0 0.0.0.0
        set distance 10
        set sdwan-zone "SDWAN"
        set comment "Default por zona SD-WAN"
    next
end

