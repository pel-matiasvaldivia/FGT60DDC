#=============================================================================
#  FIX — restaurar origen y destino en las politicas del proyecto
#  FT-60F-DDC · FortiOS 7.2.14
#
#  CAUSA: las politicas se cargaron antes que los objetos de direccion, asi
#  que todos los "set srcaddr NET-xxx" fallaron con entry not found. Una
#  politica sin srcaddr no matchea ningun trafico: todo cae al deny final.
#  Los objetos ya existen en el equipo, asi que ahora si entran.
#
#  Aplicar desde internal1 (192.168.1.99) o por el acceso temporal.
#  ANTES: execute backup config flash
#=============================================================================

#-----------------------------------------------------------------------------
#  1. Origen y destino de cada politica
#-----------------------------------------------------------------------------
config firewall policy
    edit 5
        set srcaddr "NET-MGMT-LEGACY"
    next
    edit 10
        set srcaddr "NET-USERS"
    next
    edit 11
        set srcaddr "NET-WIFICORP"
    next
    edit 12
        set srcaddr "NET-WIFIGUEST"
        set dstaddr "GRP-LAN-INTERNA"
    next
    edit 13
        set srcaddr "NET-WIFIGUEST"
    next
    edit 20
        set srcaddr "NET-USERS" "NET-WIFICORP"
        set dstaddr "NET-SERVERS"
    next
    edit 40
        set srcaddr "NET-SERVERS" "NET-PVEMGMT"
    next
    edit 50
        set srcaddr "NET-MGMT-VL60" "NET-USERS" "NET-MGMT-LEGACY"
        set dstaddr "NET-PVEMGMT"
    next
    edit 60
        set srcaddr "NET-USERS" "NET-WIFICORP"
        set dstaddr "NET-IOT"
    next
    edit 61
        set srcaddr "NET-IOT"
    next
end

#-----------------------------------------------------------------------------
#  2. Limpiar las politicas de prueba
#     La 14 quedo DESPUES del deny final: nunca se evalua, es codigo muerto.
#     La 15 duplica a la 5 (internal -> SDWAN).
#-----------------------------------------------------------------------------
config firewall policy
    delete 14
    delete 15
end

# Al borrar la 14, la 999 DENY-ALL-LOG vuelve a quedar ultima, que es donde
# tiene que estar. Verificar despues con:
#   show firewall policy | grep -e "edit " -e "set name"

#-----------------------------------------------------------------------------
#  3. DNS del sistema — sigue en DNS-over-TLS contra Fortinet
#     Con protocol dot y server-hostname de Fortinet, si ese servicio no
#     responde el FortiGate no resuelve nada, y como VL10-USERS esta en
#     forward-only, reenvia a un DNS roto.
#-----------------------------------------------------------------------------
config system dns
    set protocol cleartext
    unset server-hostname
    set primary 200.0.243.10
    set secondary 200.0.243.11
end

#-----------------------------------------------------------------------------
#  4. SD-WAN sin health-check
#     La regla de servicio quedo sin verificacion de salud: SD-WAN no sabe si
#     el enlace esta vivo y no puede conmutar cuando se sume Claro.
#-----------------------------------------------------------------------------
config system sdwan
    config health-check
        edit "ISP-CHECK"
            set server "200.0.243.10" "1.1.1.1" "8.8.8.8"
            set protocol ping
            set interval 1000
            set probe-timeout 1000
            set failtime 5
            set recoverytime 10
            set update-static-route enable
            set members 1
            config sla
                edit 1
                    set latency-threshold 200
                    set jitter-threshold 50
                    set packetloss-threshold 3
                next
            end
        next
    end
    config service
        edit 1
            set health-check "ISP-CHECK"
        next
    end
end

#-----------------------------------------------------------------------------
#  5. Guardar
#-----------------------------------------------------------------------------
execute backup config flash

#=============================================================================
#  VERIFICAR
#=============================================================================
