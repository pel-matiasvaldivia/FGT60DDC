#=============================================================================
#  CORRECCION DE LA IP WAN  -  FT-60F-DDC
#
#  Si ya aplicaste la WAN con el dato anterior (209.13.171.178/29), esto la
#  corrige. Son dos comandos: la interfaz y el gateway de SD-WAN.
#
#  VALORES CORRECTOS (confirmados por el cliente):
#     IP        209.13.181.178
#     Mascara   255.255.255.240   (/28)
#     Red       209.13.181.176/28   usables .177 a .190   broadcast .191
#     Gateway   209.13.181.177
#     DNS       200.0.243.10 / 200.0.243.11
#
#  ATENCION: si estas conectado POR INTERNET (SSL-VPN, IPsec o la GUI por
#  la IP publica), este cambio te va a cortar la sesion. Hacelo desde
#  internal1 (192.168.1.99) o desde el acceso temporal por internal4.
#  Desde la LAN no se pierde nada.
#=============================================================================

config system interface
    edit "wan1"
        set ip 209.13.181.178 255.255.255.240
        set description "Telefonica - 209.13.181.176/28"
    next
end

config system sdwan
    config members
        edit 1
            set gateway 209.13.181.177
        next
    end
end

# Si NO usas SD-WAN y tenias una ruta estatica clasica, corregir tambien:
# config router static
#     edit 1
#         set gateway 209.13.181.177
#         set device "wan1"
#     next
# end


#=============================================================================
#  VERIFICAR
#=============================================================================
#   get system interface wan1 | grep -e ip -e status
#   execute ping 209.13.181.177            <- gateway del ISP
#   execute ping 8.8.8.8                   <- internet
#   diagnose sys sdwan health-check        <- SLA en verde
#   get router info routing-table all      <- default por SDWAN
#
#   Si el ping al gateway falla pero el link esta up, pedir a Telefonica
#   que confirme IP, mascara y gateway: con un /28 mal puesto como /29 el
#   gateway .177 igual entra, asi que el sintoma seria otro (no llegar a
#   las IPs .184-.190 del propio segmento).
#
#   execute backup config flash
#=============================================================================
